[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-llm-personal-course"
version = "1.2.0"
description = "Reproducible CPU laboratories for a Russian ML/LLM course"
requires-python = ">=3.11,<3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Checker code is formatted with ruff format (plan section 3.4); 120 keeps the compact course style readable.
line-length = 120
target-version = "py311"
