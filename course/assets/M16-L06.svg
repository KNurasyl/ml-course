<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><title>Основание и смысл — разные проверки</title><rect width="960" height="460" rx="16" fill="#f4f7fb"/><text x="28" y="42" font-size="24" font-family="Arial" fill="#183f38">Основание и смысл — разные проверки</text><rect x="28" y="75" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="112" font-size="19" font-family="Arial">JSON: quote + criterion</text><text x="440" y="112" font-size="18" font-family="Arial">есть ли поля нужного типа?</text><rect x="28" y="150" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="187" font-size="19" font-family="Arial">quote присутствует в answer</text><text x="440" y="187" font-size="18" font-family="Arial">автоматическая проверка основания</text><rect x="28" y="225" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="262" font-size="19" font-family="Arial">criterion подходит к цитате</text><text x="440" y="262" font-size="18" font-family="Arial">ручная смысловая проверка</text><rect x="28" y="300" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="337" font-size="19" font-family="Arial">schema/quote не прошли</text><text x="440" y="337" font-size="18" font-family="Arial">явный отказ + вопрос по правилу</text><text x="30" y="438" font-size="17" font-family="Arial" fill="#425f64">Точная цитата не доказывает уместность выбранного критерия.</text></svg>
