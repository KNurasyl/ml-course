<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img"><title>Разбиение целыми сессиями: группы не пересекаются</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#306655"/></marker></defs><rect width="1000" height="480" fill="#f5f8f4"/>
<text x="30" y="40" font-family="Arial" font-size="25" fill="#203b32" font-weight="bold">Разбиение целыми сессиями: группы не пересекаются</text>
<rect x="35" y="85" width="220" height="75" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="49" y="114" font-family="Arial" font-size="21" fill="#203b32">Сессия A: A1, A2</text>
<rect x="35" y="200" width="220" height="75" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="49" y="229" font-family="Arial" font-size="21" fill="#203b32">Сессия B: B1, B2</text>
<rect x="400" y="135" width="240" height="90" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="414" y="164" font-family="Arial" font-size="21" fill="#203b32">Train</text>
<text x="414" y="191" font-family="Arial" font-size="21" fill="#203b32">A1, A2, B1, B2</text>
<path d="M260,123 L390,165" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M260,237 L390,200" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="35" y="335" width="220" height="75" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="49" y="364" font-family="Arial" font-size="21" fill="#203b32">Сессия C: C1, C2</text>
<rect x="400" y="335" width="240" height="75" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="414" y="364" font-family="Arial" font-size="21" fill="#203b32">Check: C1, C2</text>
<path d="M260,372 L390,372" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="695" y="165" font-family="Arial" font-size="23" fill="#203b32">Train groups</text>
<text x="695" y="205" font-family="Arial" font-size="25" fill="#203b32">{A, B}</text>
<text x="695" y="320" font-family="Arial" font-size="23" fill="#203b32">Check groups {C}</text>
<text x="400" y="455" font-family="Arial" font-size="23" fill="#203b32">{A, B} ∩ {C} = ∅; строки одной сессии не делим.</text>
</svg>
