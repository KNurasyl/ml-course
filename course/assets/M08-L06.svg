<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>LayerNorm: отдельная строка → среднее → масштаб</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#306655"/></marker></defs><rect width="1000" height="470" fill="#f5f8f4"/>
<text x="30" y="40" font-family="Arial" font-size="25" fill="#203b32" font-weight="bold">LayerNorm: отдельная строка → среднее → масштаб</text>
<rect x="30" y="80" width="290" height="110" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="44" y="109" font-family="Arial" font-size="21" fill="#203b32">x = [1, 3, 5, 7]</text>
<text x="44" y="136" font-family="Arial" font-size="21" fill="#203b32">μ = 4; variance = 5</text>
<path d="M330,130 L385,130" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="400" y="80" width="550" height="110" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="414" y="109" font-family="Arial" font-size="21" fill="#203b32">z = [−1.342, −0.447, 0.447, 1.342]</text>
<text x="414" y="136" font-family="Arial" font-size="21" fill="#203b32">y = γ · z + β (по каждой координате)</text>
<rect x="30" y="225" width="290" height="90" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="44" y="254" font-family="Arial" font-size="21" fill="#203b32">x = [10, 10, 10, 10]</text>
<text x="44" y="281" font-family="Arial" font-size="21" fill="#203b32">variance = 0; ε &gt; 0</text>
<path d="M330,270 L385,270" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="400" y="225" width="550" height="90" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="414" y="254" font-family="Arial" font-size="21" fill="#203b32">z = [0, 0, 0, 0]</text>
<text x="414" y="281" font-family="Arial" font-size="21" fill="#203b32">Нормировка не делит на ноль</text>
<text x="35" y="375" font-family="Arial" font-size="23" fill="#203b32">Residual — другая операция: [2, −1, 3] + [0.5, 1, −2] = [2.5, 0, 1]</text>
<text x="35" y="420" font-family="Arial" font-size="22" fill="#203b32">Нормируем признаки D, не позиции T и не весь датасет.</text>
</svg>
