<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img"><title>Выбор вмешательства начинается с причины ошибки</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#306655"/></marker></defs><rect width="1000" height="470" fill="#f5f8f4"/>
<text x="30" y="40" font-family="Arial" font-size="25" fill="#203b32" font-weight="bold">Выбор вмешательства начинается с причины ошибки</text>
<rect x="25" y="85" width="290" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="39" y="114" font-family="Arial" font-size="21" fill="#203b32">Формат нарушен</text>
<rect x="355" y="85" width="290" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="369" y="114" font-family="Arial" font-size="21" fill="#203b32">Нет факта в источнике</text>
<rect x="685" y="85" width="290" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="699" y="114" font-family="Arial" font-size="21" fill="#203b32">Нужен новый навык</text>
<path d="M170,160 L170,230" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M500,160 L500,230" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M830,160 L830,230" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="25" y="240" width="290" height="90" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="39" y="269" font-family="Arial" font-size="21" fill="#203b32">Инструкция + схема</text>
<text x="39" y="296" font-family="Arial" font-size="21" fill="#203b32">проверить fallback</text>
<rect x="355" y="240" width="290" height="90" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="369" y="269" font-family="Arial" font-size="21" fill="#203b32">Обновить документы</text>
<text x="369" y="296" font-family="Arial" font-size="21" fill="#203b32">проверить поиск</text>
<rect x="685" y="240" width="290" height="90" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="699" y="269" font-family="Arial" font-size="21" fill="#203b32">Примеры + SFT</text>
<text x="699" y="296" font-family="Arial" font-size="21" fill="#203b32">проверить регрессии</text>
<text x="35" y="405" font-family="Arial" font-size="22" fill="#203b32">После любого изменения — тот же независимый набор и новые ошибки.</text>
</svg>
