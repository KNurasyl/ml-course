<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><!-- Dark copy of M09-L09X.svg, generated by tools/build_dark_figures.py (D4). Edit the light file. -->
<title id="title">Сначала фильтры, потом замер</title>
<desc id="desc">Слева воронка выбора модели: лицензия версии, память, язык и токенизатор, нужные возможности; выбывшие отсеиваются, шорт-лист из двух-трёх моделей идёт на замер MP1. Справа видеопамять Qwen3.5-4B Q4_K_M на RTX 3050 Ti по замеру R06: веса 2603 МиБ плюс KV-кэш 178, 306 и 562 МиБ плюс вычисления при контексте 4096, 8192 и 16384 токенов — 2859, 2991 и 3255 МиБ при 3243 свободных. Кэш растёт на 32 КиБ на токен, как предсказывает формула.</desc>
<rect width="760" height="430" fill="#20242c"/>
<text x="16" y="34" fill="#e7e5de" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">Сначала фильтры, потом замер</text>
<rect x="16" y="56" width="380" height="358" rx="6" fill="#1b1e25" stroke="#2e333d"/>
<text x="30" y="80" fill="#a3a9b4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">Воронка: кто не прошёл — выбывает</text>
<rect x="30" y="94" width="300" height="46" rx="5" fill="#1f2a44" stroke="#86aaf0"/>
<text x="42" y="113" fill="#86aaf0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">1. Лицензия этой версии</text>
<text x="42" y="131" fill="#e7e5de" font-family="Segoe UI,Arial,sans-serif" font-size="12">файл LICENSE, пороги: пользователи или токены</text>
<rect x="30" y="152" width="300" height="46" rx="5" fill="#1f2a44" stroke="#86aaf0"/>
<text x="42" y="171" fill="#86aaf0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">2. Память до скачивания</text>
<text x="42" y="189" fill="#e7e5de" font-family="Segoe UI,Arial,sans-serif" font-size="12">веса (GGUF) + KV-кэш × контекст + буферы</text>
<rect x="30" y="210" width="300" height="46" rx="5" fill="#1f2a44" stroke="#86aaf0"/>
<text x="42" y="229" fill="#86aaf0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">3. Язык и токенизатор</text>
<text x="42" y="247" fill="#e7e5de" font-family="Segoe UI,Arial,sans-serif" font-size="12">токенов на русское слово: 2.75 у Qwen, 6.0 у SmolLM2</text>
<rect x="30" y="268" width="300" height="46" rx="5" fill="#1f2a44" stroke="#86aaf0"/>
<text x="42" y="287" fill="#86aaf0" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">4. Возможности</text>
<text x="42" y="305" fill="#e7e5de" font-family="Segoe UI,Arial,sans-serif" font-size="12">инструменты в шаблоне, нужный контекст</text>
