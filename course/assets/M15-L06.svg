<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><title>Поток: частичное ещё не окончательное</title><rect width="960" height="460" rx="16" fill="#f4f7fb"/><text x="28" y="42" font-size="24" font-family="Arial" fill="#183f38">Поток: частичное ещё не окончательное</text><rect x="28" y="75" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="112" font-size="19" font-family="Arial">0–100 мс: 1600 отсчётов</text><text x="440" y="112" font-size="18" font-family="Arial">3200 байт mono PCM16</text><rect x="28" y="150" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="187" font-size="19" font-family="Arial">partial: «я» → «я разработал»</text><text x="440" y="187" font-size="18" font-family="Arial">гипотеза заменяется</text><rect x="28" y="225" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="262" font-size="19" font-family="Arial">500 мс тихих блоков</text><text x="440" y="262" font-size="18" font-family="Arial">endpoint_final закрывает сегмент</text><rect x="28" y="300" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="337" font-size="19" font-family="Arial">cancel(turn 5)</text><text x="440" y="337" font-size="18" font-family="Arial">очередь очищена; late(5) отклонён</text><text x="30" y="438" font-size="17" font-family="Arial" fill="#425f64">Время аудио и время вычисления записываются раздельно.</text></svg>
