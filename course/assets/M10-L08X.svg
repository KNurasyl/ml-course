<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">Индекс ускоряет, фильтр может обнулить ответ</title>
<desc id="desc">Слева время запроса и recall@10 для 20 000 векторов: полный перебор 4.6 мс, HNSW при ef_search 10, 40 и 100 — от 0.17 до 0.30 мс при recall от 0.934 до 1.000. Справа запрос с фильтром на 1 % строк: HNSW вернул 0.49 строки из 10, итеративный просмотр — 10 строк за 3.0 мс, B-tree по группе — точный ответ за 0.20 мс. Внизу — эталон в памяти и зависимость recall от данных.</desc>
<rect width="760" height="450" fill="white"/>
<text x="16" y="34" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">Индекс ускоряет, фильтр может обнулить ответ</text>
<rect x="16" y="56" width="420" height="250" rx="6" fill="#eef4fc" stroke="#245bba"/>
<text x="30" y="80" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">20 000 векторов · d = 128 · k = 10</text>
<text x="30" y="100" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="13">время на запрос внутри PostgreSQL</text>
<text x="426" y="118" text-anchor="end" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="12">recall@10</text>
<text x="30" y="144" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15">Без индекса</text>
<rect x="190" y="131" width="130" height="18" fill="#245bba"/>
<text x="328" y="145" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">4.6 мс</text>
<text x="426" y="145" text-anchor="end" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">1.000</text>
<text x="30" y="184" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15">HNSW, ef_search 10</text>
<rect x="190" y="171" width="5" height="18" fill="#087e82"/>
<text x="203" y="185" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">0.17 мс</text>
<text x="426" y="185" text-anchor="end" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">0.934</text>
<text x="30" y="224" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15">HNSW, ef_search 40</text>
<rect x="190" y="211" width="7" height="18" fill="#087e82"/>
<text x="205" y="225" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">0.24 мс</text>
<text x="426" y="225" text-anchor="end" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">0.999</text>
<text x="30" y="264" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15">HNSW, ef_search 100</text>
<rect x="190" y="251" width="9" height="18" fill="#087e82"/>
<text x="207" y="265" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">0.30 мс</text>
<text x="426" y="265" text-anchor="end" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">1.000</text>
<text x="30" y="294" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="13">меньше кандидатов — быстрее, но часть соседей теряется</text>
<rect x="456" y="56" width="288" height="250" rx="6" fill="#fff3e5" stroke="#a65c12"/>
<text x="470" y="80" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Фильтр: группа ≈ 1 % строк</text>
<rect x="470" y="96" width="260" height="58" rx="6" fill="white" stroke="#a65c12"/>
<text x="482" y="118" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">HNSW и WHERE</text>
<text x="482" y="140" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="14">0.49 строки из 10 · recall 0.05</text>
<rect x="470" y="164" width="260" height="58" rx="6" fill="white" stroke="#087e82"/>
<text x="482" y="186" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Итеративный просмотр</text>
<text x="482" y="208" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">10 строк · recall 0.939 · 3.0 мс</text>
<rect x="470" y="232" width="260" height="58" rx="6" fill="white" stroke="#087e82"/>
<text x="482" y="254" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">B-tree по группе</text>
<text x="482" y="276" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">10 строк · точно · 0.20 мс</text>
<rect x="16" y="322" width="728" height="54" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="30" y="346" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Эталон — точный поиск в памяти: sqlite-vec и pgvector без индекса совпали с ним до порядка</text>
<text x="30" y="367" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">На данных почти без кластеров HNSW при ef_search 100 нашёл 76 % соседей: recall зависит от данных</text>
<text x="16" y="404" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="14">Авторский прогон 05.11.2026, CPU. HNSW строится со случайными уровнями: повтор даёт близкие числа.</text>
<text x="16" y="428" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="14">Это поведение индексов на синтетике, а не сравнение продуктов.</text>
</svg>
