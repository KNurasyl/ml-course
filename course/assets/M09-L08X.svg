<rect x="16" y="352" width="728" height="56" rx="6" fill="#fff3e5" stroke="#a65c12"/>
<text x="30" y="375" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">0.5B под GBNF поставил 2 всем 24 ответам — и с отзывом «Ответ кандидата не верен.»</text>
<text x="30" y="396" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">Повтор с причиной менял оценку 2 → 1 → 0, а формат оставлял прежним; у 4B ответы со схемой и без одинаковы</text>
<text x="16" y="434" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="13">Авторский прогон 06.11.2026, llama.cpp b11803, жадная генерация; эталонные оценки поставил автор курса.</text>
