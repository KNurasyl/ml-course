<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">Форма гарантирована, суждение — нет</title>
<desc id="desc">Из 24 ответов кандидатов: Qwen2.5-0.5B прошёл контракт в 21 случае только с просьбой в prompt, в 24 с json_object, json_schema и GBNF и в 21 с повтором; верная оценка — 9, 9, 9, 8 и 9 случаев, на уровне правила «всегда 2», которое даёт 8. Qwen3.5-4B прошёл контракт 24 раза с схемой и без и дал верную оценку в 18 случаях. Внизу — противоречие отзыва и оценки и поведение повтора.</desc>
