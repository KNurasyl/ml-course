<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><title>Разрешение действия отделено от генерации</title><rect width="960" height="460" rx="16" fill="#f4f7fb"/><text x="28" y="42" font-size="24" font-family="Arial" fill="#183f38">Разрешение действия отделено от генерации</text><rect x="28" y="75" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="112" font-size="19" font-family="Arial">LLM: предложение</text><text x="440" y="112" font-size="18" font-family="Arial">JSON tool + args</text><rect x="28" y="150" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="187" font-size="19" font-family="Arial">Parser: проверка</text><text x="440" y="187" font-size="18" font-family="Arial">тип, ключи, допустимые имена</text><rect x="28" y="225" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="262" font-size="19" font-family="Arial">Executor: серверный scope</text><text x="440" y="262" font-size="18" font-family="Arial">d1 разрешён / d2 отклонён</text><rect x="28" y="300" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="337" font-size="19" font-family="Arial">Observation → новый вызов</text><text x="440" y="337" font-size="18" font-family="Arial">finish, повтор или лимит</text><text x="30" y="438" font-size="17" font-family="Arial" fill="#425f64">Каждая строка — отдельная граница; текст не наделяет правами.</text></svg>
