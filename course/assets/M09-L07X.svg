<svg xmlns="http://www.w3.org/2000/svg" width="760" height="450" viewBox="0 0 760 450" role="img" aria-labelledby="title desc">
<title id="title">Где уходит время и память при локальном serving</title>
<desc id="desc">Слева — скорость генерации на CPU в 4 потока: Qwen2.5-0.5B в transformers float32 — 5.5 токена в секунду, в llama.cpp Q8_0 — 18.6, Q4_K_M — 24.2, Qwen3.5-4B Q4_K_M — 3.4. Справа — доля весов по типу хранения: в файле Q4_K_M модели 0.5B 62 процента весов лежат в Q5_0, 22 в Q8_0, по 8 в Q6_K и Q4_K, в среднем 6.16 бита на вес; у 4B 58 процентов в Q4_K, 24 в Q6_K, 18 в Q5_K, 5.19 бита. Внизу — задержка ответа 4B и разница между RSS и потребностью в памяти.</desc>
<rect width="760" height="450" fill="white"/>
<text x="16" y="34" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">Где уходит время и память при локальном serving</text>
<rect x="16" y="56" width="360" height="270" rx="6" fill="#eef4fc" stroke="#245bba"/>
<text x="30" y="80" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Генерация, токенов в секунду</text>
<text x="30" y="98" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="12">CPU, 4 потока, медиана по 6 запросам</text>
<text x="30" y="134" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">0.5B · transformers f32</text>
<rect x="190" y="121" width="30" height="18" fill="#245bba"/>
<text x="228" y="135" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">5.5</text>
<text x="30" y="174" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">0.5B · llama.cpp Q8_0</text>
<rect x="190" y="161" width="100" height="18" fill="#087e82"/>
<text x="298" y="175" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">18.6</text>
<text x="30" y="214" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">0.5B · llama.cpp Q4_K_M</text>
<rect x="190" y="201" width="130" height="18" fill="#087e82"/>
<text x="328" y="215" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">24.2</text>
<text x="30" y="254" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">4B · llama.cpp Q4_K_M</text>
<rect x="190" y="241" width="18" height="18" fill="#a65c12"/>
<text x="216" y="255" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">3.4</text>
<text x="30" y="290" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="12">генерация читает все веса на каждый токен:</text>
<text x="30" y="308" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="12">меньше байтов — больше токенов в секунду</text>
<rect x="392" y="56" width="352" height="270" rx="6" fill="#fff3e5" stroke="#a65c12"/>
<text x="406" y="80" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Что внутри «Q4_K_M»</text>
<text x="406" y="98" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="12">доля весов по типу хранения</text>
<text x="406" y="124" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Qwen2.5-0.5B · 6.16 бита на вес</text>
<rect x="406" y="132" width="197" height="22" fill="#a65c12"/>
<rect x="603" y="132" width="70" height="22" fill="#182b3a"/>
<rect x="673" y="132" width="27" height="22" fill="#245bba"/>
<rect x="700" y="132" width="26" height="22" fill="#087e82"/>
<text x="408" y="170" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="12">Q5_0 62 %</text>
<text x="605" y="170" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="12">Q8_0 22 %</text>
<text x="726" y="186" text-anchor="end" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="12">Q6_K 8 % · Q4_K 8 %</text>
<text x="406" y="214" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600">Qwen3.5-4B · 5.19 бита на вес</text>
<rect x="406" y="222" width="184" height="22" fill="#087e82"/>
<rect x="590" y="222" width="78" height="22" fill="#245bba"/>
<rect x="668" y="222" width="58" height="22" fill="#a65c12"/>
<text x="408" y="260" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="12">Q4_K 58 %</text>
<text x="592" y="260" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="12">Q6_K 24 %</text>
<text x="670" y="260" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="12">Q5_K 18 %</text>
<text x="406" y="290" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="12">бит на вес: Q4_K 4.5 · Q5 5.5 · Q6_K 6.56 · Q8_0 8.5</text>
<text x="406" y="308" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="12">ширина 896 не делится на 256 → Q5_0 вместо Q4_K</text>
<rect x="16" y="342" width="728" height="56" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="30" y="366" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600">4B: 1.5 с до первого токена и 3.4 токена в секунду — ответ из 64 токенов около 20 с</text>
<text x="30" y="387" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">Пик RSS 4893 МиБ ≠ потребность: веса отображены из файла, плюс переупакованная копия для ядер CPU</text>
<text x="16" y="428" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="13">Авторский прогон 06.11.2026, Intel Core i7-11800H, llama.cpp b11803; в первом прогоне скорость генерации была ниже на 3–35 %.</text>
</svg>
