<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">GPT с нуля: кривые потерь</title>
<desc id="desc">Кривые потерь на токен по шагам обучения для двух моделей на тексте курса. small (1.35 млн параметров): лучшая проверка 4.4023 на шаге 1200, тест 4.1396, 1.1374 бита на байт; plan (10.48 млн параметров): лучшая проверка 3.6291 на шаге 1200, тест 3.2546, 0.8942 бита на байт. Для сравнения на тесте: униграммная модель 6.9483, биграммная 4.8866, равномерная 8.3178; lzma, которому показан обучающий текст, — 1.1204 бита на байт. Проверка обеих моделей ещё снижалась на последнем шаге.</desc>
