<desc id="desc">Сверху — один и тот же адаптер ранга 4 записан вручную в M12-L07 и через PEFT: на одинаковых весах разница логитов 0.0, обучаемых чисел 30720, файл весов 124960 байт. В середине — потеря по шагам обучения для двух вариантов на фоне блоков по шесть примеров CLARIFY и NEXT: у варианта на всех Linear потеря внутри блока падает почти до нуля и подскакивает до 8.5 на смене класса. Снизу — old NLL после обучения: M12-L07 2.324, PEFT та же конфигурация 2.324, PEFT на всех Linear 10.734.</desc>
