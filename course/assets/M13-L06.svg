<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><title>A и B: одна работа, разное ожидание</title><rect width="960" height="460" rx="16" fill="#f4f7fb"/><text x="28" y="42" font-size="24" font-family="Arial" fill="#183f38">A и B: одна работа, разное ожидание</text><rect x="28" y="75" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="112" font-size="19" font-family="Arial">A: очередь 0 мс</text><text x="440" y="112" font-size="18" font-family="Arial">работа 0–80 → ответ около 80 мс</text><rect x="28" y="150" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="187" font-size="19" font-family="Arial">B: очередь 0–80 мс</text><text x="440" y="187" font-size="18" font-family="Arial">работа 80–160 → ответ около 160 мс</text><rect x="28" y="225" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="262" font-size="19" font-family="Arial">B с дедлайном 10 мс</text><text x="440" y="262" font-size="18" font-family="Arial">отказ до вычисления</text><rect x="28" y="300" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="337" font-size="19" font-family="Arial">C при вместимости 2</text><text x="440" y="337" font-size="18" font-family="Arial">переполнение → 503</text><text x="30" y="438" font-size="17" font-family="Arial" fill="#425f64">Ручной прогноз для одновременного входа; фактическое время измеряется.</text></svg>
