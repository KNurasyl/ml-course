<desc id="desc">Слева — сколько из 24 перефразированных вопросов получили нужный документ первым после трёх первых стадий: порядок первой стадии, эвристика 1.1.0 и cross-encoder. RRF TF-IDF и BM25: 11, 12 и 22 при 23 вопросах с документом в пуле. MiniLM: 4, 8 и 15 при 17 в пуле. USER-bge-m3: 19, 18 и 22 при 23 в пуле. Справа — медиана задержки cross-encoder на CPU в 4 потока: 1.2, 2.5, 4.9 и 9.9 секунды для 5, 10, 20 и 40 пар. Внизу — перебор всех 72 фрагментов и порог по sigmoid.</desc>
