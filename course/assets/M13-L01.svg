<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><title>M13-L01 · Версия эксперимента и релиза</title><rect width="960" height="460" rx="16" fill="#f4f7fb"/><text x="28" y="42" font-size="24" font-family="Arial" fill="#183f38">M13-L01 · Версия эксперимента и релиза</text><rect x="28" y="75" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="112" font-size="19" font-family="Arial">Код: commit + hash</text><text x="440" y="112" font-size="18" font-family="Arial">Данные: снимок + hash</text><rect x="28" y="150" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="187" font-size="19" font-family="Arial">Веса: файл + hash</text><text x="440" y="187" font-size="18" font-family="Arial">Prompt и индекс</text><rect x="28" y="225" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="262" font-size="19" font-family="Arial">Один release_id</text><text x="440" y="262" font-size="18" font-family="Arial">Запрос → release_id</text><text x="30" y="438" font-size="17" font-family="Arial" fill="#425f64">Парные понятия для сопоставления; строки не обозначают поток выполнения.</text></svg>