<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title"><title id="title">M13-L01 · Версия эксперимента и релиза</title><rect width="1040" height="420" rx="20" fill="#f4f7fb"/><text x="35" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15263d">M13-L01 · Версия эксперимента и релиза</text><rect x="35" y="85" width="300" height="100" rx="14" fill="white" stroke="#28775b" stroke-width="2"/><text x="51" y="120" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Код: commit + hash</text><path d="M341,135h20m-6,-5l6,5l-6,5" fill="none" stroke="#28775b" stroke-width="2"/><rect x="370" y="85" width="300" height="100" rx="14" fill="white" stroke="#28775b" stroke-width="2"/><text x="386" y="120" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Данные: снимок + hash</text><path d="M676,135h20m-6,-5l6,5l-6,5" fill="none" stroke="#28775b" stroke-width="2"/><rect x="705" y="85" width="300" height="100" rx="14" fill="white" stroke="#28775b" stroke-width="2"/><text x="721" y="120" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Веса: файл + hash</text><rect x="35" y="230" width="300" height="100" rx="14" fill="white" stroke="#28775b" stroke-width="2"/><text x="51" y="265" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Prompt и индекс</text><path d="M341,280h20m-6,-5l6,5l-6,5" fill="none" stroke="#28775b" stroke-width="2"/><rect x="370" y="230" width="300" height="100" rx="14" fill="white" stroke="#28775b" stroke-width="2"/><text x="386" y="265" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Один release_id</text><path d="M676,280h20m-6,-5l6,5l-6,5" fill="none" stroke="#28775b" stroke-width="2"/><rect x="705" y="230" width="300" height="100" rx="14" fill="white" stroke="#28775b" stroke-width="2"/><text x="721" y="265" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Запрос → release_id</text><text x="35" y="390"