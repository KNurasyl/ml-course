<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
<title id="title">DPO через TRL</title>
<desc id="desc">Слева — две отложенные пары с расплывчатым ответом кандидата: log-вероятность выбранного CLARIFY и отвергнутого NEXT у SFT и после DPO. «My project went very well.»: выбранный -5.702 → -5.666, отвергнутый -3.362 → -7.879; «Everyone liked our improvements.»: выбранный -4.956 → -5.106, отвергнутый -3.66 → -8.033. Справа — вероятность первого токена ответа: у SFT NEXT 0.739, после DPO 0.704, после DPO с SFT-слагаемым 0.301; у CLARIFY 0.032, 0.038 и 0.546. Снизу — точность на отложенных парах и число неверных команд: SFT 0.5 и 2 из 4, DPO 1.0 и 2 из 4, DPO с SFT-слагаемым 1.0 и 0 из 4.</desc>
