<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Вторая конфигурация речи</title>
<desc id="desc">Сверху — две конфигурации речи на одном контракте WAV mono PCM16 16 кГц: Windows SAPI с голосом Irina и Vosk small-ru, Piper с голосом Denis и faster-whisper small int8. Слева снизу — WER на 40 фразах для каждой пары голоса и распознавателя: sapi->vosk 0.174; piper->vosk 0.311; sapi->whisper 0.090; piper->whisper 0.179. Для Piper показан разброс по трём синтезам: Vosk от 0.257 до 0.311, Whisper от 0.173 до 0.193. Справа снизу — задержки: синтез фразы SAPI 0.414 с, Piper 0.086 с после загрузки голоса за 3.84 с; RTF распознавания Vosk 0.14, Whisper 0.386 на голосе SAPI.</desc>
