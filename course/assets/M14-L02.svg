<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title"><title id="title">M14-L02 · Контракт инструмента</title><rect width="1040" height="420" rx="20" fill="#f4f7fb"/><text x="35" y="48" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15263d">M14-L02 · Контракт инструмента</text><rect x="35" y="85" width="300" height="100" rx="14" fill="white" stroke="#7957bc" stroke-width="2"/><text x="51" y="120" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Имя разрешено?</text><path d="M341,135h20m-6,-5l6,5l-6,5" fill="none" stroke="#7957bc" stroke-width="2"/><rect x="370" y="85" width="300" height="100" rx="14" fill="white" stroke="#7957bc" stroke-width="2"/><text x="386" y="120" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Аргументы точны?</text><path d="M676,135h20m-6,-5l6,5l-6,5" fill="none" stroke="#7957bc" stroke-width="2"/><rect x="705" y="85" width="300" height="100" rx="14" fill="white" stroke="#7957bc" stroke-width="2"/><text x="721" y="120" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Типы допустимы?</text><rect x="35" y="230" width="300" height="100" rx="14" fill="white" stroke="#7957bc" stroke-width="2"/><text x="51" y="265" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Область доступа?</text><path d="M341,280h20m-6,-5l6,5l-6,5" fill="none" stroke="#7957bc" stroke-width="2"/><rect x="370" y="230" width="300" height="100" rx="14" fill="white" stroke="#7957bc" stroke-width="2"/><text x="386" y="265" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Выполнить чтение</text><path d="M676,280h20m-6,-5l6,5l-6,5" fill="none" stroke="#7957bc" stroke-width="2"/><rect x="705" y="230" width="300" height="100" rx="14" fill="white" stroke="#7957bc" stroke-width="2"/><text x="721" y="265" font-family="Arial,sans-serif" font-size="19" fill="#15263d">Результат по схеме</text><text x="35" y="390" font-family="Arial,sans-s