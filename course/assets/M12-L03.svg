<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img"><title>Биграмма: предыдущий символ выбирает строку весов</title><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#306655"/></marker></defs><rect width="1000" height="450" fill="#f5f8f4"/>
<text x="30" y="40" font-family="Arial" font-size="25" fill="#203b32" font-weight="bold">Биграмма: предыдущий символ выбирает строку весов</text>
<rect x="60" y="110" width="100" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="74" y="139" font-family="Arial" font-size="21" fill="#203b32">^</text>
<rect x="210" y="110" width="100" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="224" y="139" font-family="Arial" font-size="21" fill="#203b32">a</text>
<rect x="360" y="110" width="100" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="374" y="139" font-family="Arial" font-size="21" fill="#203b32">b</text>
<rect x="510" y="110" width="100" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="524" y="139" font-family="Arial" font-size="21" fill="#203b32">a</text>
<rect x="660" y="110" width="100" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="674" y="139" font-family="Arial" font-size="21" fill="#203b32">b</text>
<rect x="810" y="110" width="100" height="70" rx="10" fill="#e0eee0" stroke="#6f977f"/>
<text x="824" y="139" font-family="Arial" font-size="21" fill="#203b32">$</text>
<path d="M160,145 L200,145" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M310,145 L350,145" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M460,145 L500,145" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M610,145 L650,145" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<path d="M760,145 L800,145" stroke="#306655" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="35" y="245" font-family="Arial" font-size="25" fill="#203b32">Для пары a → b обучается вероятность b по строке W[a].</text>
<text x="35" y="295" font-family="Arial" font-size="25" fill="#203b32">Алфавит ^ a b c $ → W имеет форму [5,5] = 25 весов.</text>
<text x="35" y="350" font-family="Arial" font-size="23" fill="#203b32">Строка W[a] не видит всю историю: aba и aaaa дают тот же вход a.</text>
<text x="35" y="405" font-family="Arial" font-size="22" fill="#203b32">Transformer в M12-L06/07 видит доступный контекст через attention.</text>
</svg>
