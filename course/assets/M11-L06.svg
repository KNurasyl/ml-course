<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc"><title id="title">Парное сравнение по case_id</title><desc id="desc">Один случай подаётся двум версиям. Ответы сохраняются отдельно, затем размечаются и соединяются по одному идентификатору. Пропуск не равен нулю.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#315e53"/></marker></defs><rect width="980" height="420" fill="#f4f7ef" rx="16"/><g font-family="Segoe UI,Arial" fill="#233c34"><text x="30" y="40" font-size="25" font-weight="bold">Один вход, два сохранённых ответа, общая рубрика</text><g fill="white" stroke="#437a67" stroke-width="2"><rect x="25" y="155" width="180" height="85" rx="12"/><rect x="290" y="80" width="210" height="100" rx="12"/><rect x="290" y="240" width="210" height="100" rx="12"/><rect x="590" y="80" width="185" height="100" rx="12"/><rect x="590" y="240" width="185" height="100" rx="12"/></g><g font-size="20"><text x="45" y="190">case_id = p</text><text x="45" y="220">вопрос + ответ</text><text x="310" y="117">Версия A</text><text x="310" y="150">raw + display + hash</text><text x="310" y="277">Версия B</text><text x="310" y="310">raw + display + hash</text><text x="610" y="115">Разметка A</text><text x="610" y="150">балл + основание</text><text x="610" y="275">Разметка B</text><text x="610" y="310">балл + основание</text><text x="810" y="185">JOIN по ID</text><text x="810" y="220">B − A</text></g><g fill="none" stroke="#315e53" stroke-width="2.5" marker-end="url(#arrow)"><path d="M205 195L250 195L250 130L285 130"/><path d="M205 205L250 205L250 290L285 290"/><path d="M500 130H585"/><path d="M500 290H585"/><path d="M775 130H850V160"/><path d="M775 290H850V235"/></g><text x="30" y="390" font-size="20">Отсутствующая оценка ≠ 0. Новая критическая ошибка блокирует выпуск независимо от среднего.</text></g></svg>
