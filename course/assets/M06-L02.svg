<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 422" role="img" aria-labelledby="title"><title id="title">Контуры данных и модели</title><rect width="1040" height="422" fill="#f5f7fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="25" fill="#182b49">Контуры данных и модели</text><rect x="30" y="72" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="105" font-size="19" fill="#15457e">Обучение</text><path d="M340 99h28" stroke="#47749e" stroke-width="3"/><path d="M361 93l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="105" font-size="18" fill="#182b49">Снимок → preprocessing → веса → проверка</text><rect x="30" y="140" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="173" font-size="19" fill="#15457e">Выпуск A</text><path d="M340 167h28" stroke="#47749e" stroke-width="3"/><path d="M361 161l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="173" font-size="18" fill="#182b49">μ=10, s=2, w=3, b=1</text><rect x="30" y="208" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="241" font-size="19" fill="#15457e">Запрос x=14</text><path d="M340 235h28" stroke="#47749e" stroke-width="3"/><path d="M361 229l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="241" font-size="18" fill="#182b49">(14−10)/2=2 → 3×2+1=7</text><rect x="30" y="276" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="309" font-size="19" fill="#15457e">Смешанные версии</text><path d="M340 303h28" stroke="#47749e" stroke-width="3"/><path d="M361 297l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="309" font-size="18" fill="#182b49">μ=12 + старый w → ответ 4 вместо 7</text><text x="32" y="398" font-size="16" fill="#536780">Учебный пример: числа заданы для разбора механизма.</text></g></svg>
