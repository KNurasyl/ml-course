<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><title>Тема и номер операции не совпадают</title><rect width="960" height="460" rx="16" fill="#f4f7fb"/><text x="28" y="42" font-size="24" font-family="Arial" fill="#183f38">Тема и номер операции не совпадают</text><rect x="28" y="75" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="112" font-size="19" font-family="Arial">topic 0, turn 0, основной</text><text x="440" y="112" font-size="18" font-family="Arial">короткий ответ → уточнить</text><rect x="28" y="150" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="187" font-size="19" font-family="Arial">topic 0, turn 1, уточнение</text><text x="440" y="187" font-size="18" font-family="Arial">любой ответ → следующая тема</text><rect x="28" y="225" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="262" font-size="19" font-family="Arial">topic 1, turn 2, основной</text><text x="440" y="262" font-size="18" font-family="Arial">отказ → тема 2 без уточнения</text><rect x="28" y="300" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="337" font-size="19" font-family="Arial">после темы 3</text><text x="440" y="337" font-size="18" font-family="Arial">finished; нового вопроса нет</text><text x="30" y="438" font-size="17" font-family="Arial" fill="#425f64">Уточнение ограничено; отказ всегда разрешает переход к следующей теме.</text></svg>
