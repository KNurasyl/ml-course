<svg xmlns="http://www.w3.org/2000/svg" width="360" height="594" viewBox="0 0 360 594" role="img" aria-labelledby="M09-L06-mobile-title M09-L06-mobile-desc"><title id="M09-L06-mobile-title">Память: три разных измерения</title><desc id="M09-L06-mobile-desc">Память: три разных измерения. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M09-L06-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M09-L06-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Память: три разных</text>
<text x="16" y="55" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">измерения</text>
<path d="M16,184 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="90" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="106" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Артефакт на диске</text>
<text x="30" y="134" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Размер сериализованных весов:</text>
<text x="30" y="158" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">float32 / packed int8</text>
<path d="M16,294 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="200" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="216" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Работающий процесс</text>
<text x="30" y="244" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">RSS после подготовки: модель</text>
<text x="30" y="268" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">+ библиотеки</text>
<path d="M16,404 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="310" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="326" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Наблюдаемый пик</text>
<text x="30" y="354" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Всё дерево процесса; шаг</text>
<text x="30" y="378" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">измерения 30 мс</text>
<path d="M16,514 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="420" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="436" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Скорость — отдельно</text>
<text x="30" y="464" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">40 токенов / 10 секунд = 4</text>
<text x="30" y="488" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">token/s = 0.25 s/token</text>
<text x="16" y="542" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Не складывай и не подменяй эти</text>
<text x="16" y="564" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">измерения.</text>
</svg>
