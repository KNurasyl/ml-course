<svg xmlns="http://www.w3.org/2000/svg" width="760" height="321" viewBox="0 0 760 321" role="img" aria-labelledby="title desc"><title id="title">Цель и ограничения</title><desc id="desc">Цель и ограничения. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="760" height="321" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Цель и ограничения</text>
<path d="M16,101 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">100 попыток</text>
<text x="280" y="79" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">90 стартов → доступность 90%</text>
<path d="M16,155 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="133" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">90 начатых сессий</text>
<text x="280" y="133" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">72 завершения → условная доля 80%</text>
<path d="M16,209 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="187" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">30 проверенных ответов</text>
<text x="280" y="187" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">24 корректных → качество выборки 80%</text>
<path d="M16,263 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="241" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Цель по задержке</text>
<text x="280" y="241" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Станет фактом только после измерения</text>
<text x="16" y="291" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в пояснении урока.</text>
</svg>
