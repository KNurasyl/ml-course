<svg xmlns="http://www.w3.org/2000/svg" width="360" height="498" viewBox="0 0 360 498" role="img" aria-labelledby="M01-L01-mobile-title M01-L01-mobile-desc"><title id="M01-L01-mobile-title">Среднее по axis=0 сохраняет признаки</title><desc id="M01-L01-mobile-desc">Среднее по axis=0 сохраняет признаки. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M01-L01-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M01-L01-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Среднее по axis=0 сохраняет</text>
<text x="16" y="55" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">признаки</text>
<path d="M16,160 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="90" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="106" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Объект 1</text>
<text x="30" y="134" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Признак 1: 1; признак 2: 10</text>
<path d="M16,246 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="176" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="192" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Объект 2</text>
<text x="30" y="220" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Признак 1: 3; признак 2: 30</text>
<path d="M16,332 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="262" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="278" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Объект 3</text>
<text x="30" y="306" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Признак 1: 5; признак 2: 50</text>
<path d="M16,418 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="348" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="364" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Среднее по трём строкам</text>
<text x="30" y="392" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Признак 1: 3; признак 2: 30</text>
<text x="16" y="446" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Исходная форма [3,2] →</text>
<text x="16" y="468" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">результат [2].</text>
</svg>
