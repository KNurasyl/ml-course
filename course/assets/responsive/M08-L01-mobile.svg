<svg xmlns="http://www.w3.org/2000/svg" width="360" height="605" viewBox="0 0 360 605" role="img" aria-labelledby="M08-L01-mobile-title M08-L01-mobile-desc"><title id="M08-L01-mobile-title">Текст и токены</title><desc id="M08-L01-mobile-desc">Текст и токены. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M08-L01-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M08-L01-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Текст и токены</text>
<path d="M16,133 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="63" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="79" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Строка</text>
<text x="30" y="107" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">«кот» — 3 символа</text>
<path d="M16,219 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="149" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="165" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Словарь</text>
<text x="30" y="193" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">0=пробел, 1=к, 2=о, 3=т</text>
<path d="M16,329 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="235" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="251" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Идентификаторы</text>
<text x="30" y="279" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[1, 2, 3] — адреса, не</text>
<text x="30" y="303" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">смысловые числа</text>
<path d="M16,415 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="345" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="361" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Next-token цель</text>
<text x="30" y="389" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">input [1,2] → target [2,3]</text>
<path d="M16,525 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="431" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="447" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Настоящая LLM</text>
<text x="30" y="475" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Считать её tokenizer, не</text>
<text x="30" y="499" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">длину строки</text>
<text x="16" y="553" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в</text>
<text x="16" y="575" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">пояснении урока.</text>
</svg>
