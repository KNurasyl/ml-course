<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375" viewBox="0 0 760 375" role="img" aria-labelledby="title desc"><title id="title">Мини-языковая модель</title><desc id="desc">Мини-языковая модель. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="760" height="375" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Мини-языковая модель</text>
<path d="M16,101 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Последовательность</text>
<text x="280" y="79" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">a,b,c,d → вход a,b,c / цель b,c,d</text>
<path d="M16,155 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="133" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Вероятности цели</text>
<text x="280" y="133" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">0,5;0,25;0,5</text>
<path d="M16,209 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="187" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Средний NLL</text>
<text x="280" y="187" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">0,9242 натуральных единицы на токен</text>
<path d="M16,263 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="241" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Perplexity</text>
<text x="280" y="241" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">exp(0,9242)=2,5198</text>
<path d="M16,317 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="295" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Область вывода</text>
<text x="280" y="295" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Только отложенная синтетическая грамматика</text>
<text x="16" y="345" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в пояснении урока.</text>
</svg>
