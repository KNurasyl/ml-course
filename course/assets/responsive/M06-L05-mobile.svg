<svg xmlns="http://www.w3.org/2000/svg" width="360" height="543" viewBox="0 0 360 543" role="img" aria-labelledby="title desc"><title id="title">Отказы и откат</title><desc id="desc">Отказы и откат. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="543" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Отказы и откат</text>
<path d="M16,133 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="63" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">S7:3 впервые</text>
<text x="30" y="107" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Сохранить один логический ход</text>
<path d="M16,243 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="149" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="165" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">S7:3 повторно</text>
<text x="30" y="193" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Вернуть тот же результат /</text>
<text x="30" y="217" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">in_progress</text>
<path d="M16,353 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="259" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="275" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Поздний результат S7:2</text>
<text x="30" y="303" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Не публиковать в активный ход</text>
<text x="30" y="327" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">3</text>
<path d="M16,463 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="369" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="385" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Откат выпуска</text>
<text x="30" y="413" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Веса + preprocessing +</text>
<text x="30" y="437" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">проверка ответа</text>
<text x="16" y="491" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в</text>
<text x="16" y="513" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">пояснении урока.</text>
</svg>
