<svg xmlns="http://www.w3.org/2000/svg" width="360" height="616" viewBox="0 0 360 616" role="img" aria-labelledby="M12-L03-mobile-title M12-L03-mobile-desc"><title id="M12-L03-mobile-title">Биграмма видит предыдущий символ</title><desc id="M12-L03-mobile-desc">Биграмма видит предыдущий символ. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M12-L03-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M12-L03-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Биграмма видит предыдущий</text>
<text x="16" y="55" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">символ</text>
<path d="M16,160 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="90" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="106" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Цепочка символов</text>
<text x="30" y="134" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">^ → a → b → a → b → $</text>
<path d="M16,270 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="176" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="192" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Пара a → b</text>
<text x="30" y="220" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Обучается вероятность b по</text>
<text x="30" y="244" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">строке W[a].</text>
<path d="M16,380 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="286" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="302" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Алфавит: ^ a b c $</text>
<text x="30" y="330" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">W имеет форму [5,5] = 25</text>
<text x="30" y="354" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">весов.</text>
<path d="M16,514 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="396" width="3" height="110" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="412" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Предел контекста</text>
<text x="30" y="440" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">aba и aaaa оканчиваются на a:</text>
<text x="30" y="464" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">используется одна строка</text>
<text x="30" y="488" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">W[a].</text>
<text x="16" y="542" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Transformer получает доступный</text>
<text x="16" y="564" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">контекст через attention;</text>
<text x="16" y="586" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">биграмма его не видит.</text>
</svg>
