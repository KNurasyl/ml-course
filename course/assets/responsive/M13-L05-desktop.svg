<svg xmlns="http://www.w3.org/2000/svg" width="760" height="291" viewBox="0 0 760 291" role="img" aria-labelledby="M13-L05-desktop-title M13-L05-desktop-desc"><title id="M13-L05-desktop-title">M13-L05 · Неудачный релиз и восстановление</title><desc id="M13-L05-desktop-desc">M13-L05 · Неудачный релиз и восстановление. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M13-L05-desktop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M13-L05-desktop-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">M13-L05 · Неудачный релиз и восстановление</text>
