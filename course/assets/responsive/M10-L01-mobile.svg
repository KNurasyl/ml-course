<svg xmlns="http://www.w3.org/2000/svg" width="360" height="653" viewBox="0 0 360 653" role="img" aria-labelledby="M10-L01-mobile-title M10-L01-mobile-desc"><title id="M10-L01-mobile-title">Документ и фрагмент</title><desc id="M10-L01-mobile-desc">Документ и фрагмент. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M10-L01-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M10-L01-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
