<text x="30" y="107" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Исходный текст + источник +</text>
<text x="30" y="131" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">актуальность</text>
<path d="M16,267 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="173" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="189" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Структурная нарезка</text>
<text x="30" y="217" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Сохраняет условие и</text>
<text x="30" y="241" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">исключение вместе</text>
<path d="M16,353 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="283" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="299" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Chunk ID</text>
<text x="30" y="327" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">document / version / section</text>
<path d="M16,463 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="369" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="385" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Индекс</text>
<text x="30" y="413" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Текст и embedding одной</text>
<text x="30" y="437" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">версии</text>
<path d="M16,573 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="479" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="495" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Обновление</text>
<text x="30" y="523" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Новый snapshot → проверки →</text>
<text x="30" y="547" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">переключение</text>
