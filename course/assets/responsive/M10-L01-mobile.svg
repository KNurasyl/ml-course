<svg xmlns="http://www.w3.org/2000/svg" width="360" height="653" viewBox="0 0 360 653" role="img" aria-labelledby="title desc"><title id="title">Документ и фрагмент</title><desc id="desc">Документ и фрагмент. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="653" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Документ и фрагмент</text>
<path d="M16,157 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="63" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
