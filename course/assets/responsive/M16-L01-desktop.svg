<svg xmlns="http://www.w3.org/2000/svg" width="760" height="417" viewBox="0 0 760 417" role="img" aria-labelledby="title desc"><title id="title">Две рубрики проверяют разные свойства</title><desc id="desc">Две рубрики проверяют разные свойства. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="760" height="417" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Две рубрики проверяют разные свойства</text>
<path d="M16,125 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Содержание</text>
<text x="280" y="79" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">HR: конкретное личное действие. Техническое:</text>
<text x="280" y="103" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">корректный факт.</text>
<path d="M16,203 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="157" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Обоснование</text>
<text x="280" y="157" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">HR: почему выбрано действие. Техническое:</text>
<text x="280" y="181" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">компромиссы и ограничения.</text>
<path d="M16,281 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="235" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Проверка</text>
<text x="280" y="235" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">HR: подтверждённый результат. Техническое: план</text>
<text x="280" y="259" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">измерения / тест.</text>
<path d="M16,359 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="313" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Критическая ошибка</text>
<text x="280" y="313" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">HR: приписанный опыт. Техническое: ложный факт</text>
<text x="280" y="337" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">или вывод.</text>
<text x="16" y="387" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Оценка относится к ответу по явной рубрике, не к личности.</text>
</svg>
