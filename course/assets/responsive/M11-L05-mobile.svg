<svg xmlns="http://www.w3.org/2000/svg" width="360" height="581" viewBox="0 0 360 581" role="img" aria-labelledby="title desc"><title id="title">Регрессии и отчёт</title><desc id="desc">Регрессии и отчёт. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="581" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Регрессии и отчёт</text>
<path d="M16,133 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="63" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Baseline</text>
<text x="30" y="107" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[1,1,0,0,1,0] →3/6</text>
<path d="M16,219 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="149" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="165" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Candidate</text>
<text x="30" y="193" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[1,0,1,0,1,1] →4/6</text>
<path d="M16,305 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="235" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="251" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Изменения</text>
<text x="30" y="279" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">2 исправления,1 регрессия</text>
<path d="M16,415 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="321" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="337" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Средний прирост</text>
<text x="30" y="365" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">(2−1)/6 =16,7 процентного</text>
<text x="30" y="389" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">пункта</text>
<path d="M16,501 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="431" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="447" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Критический case2</text>
<text x="30" y="475" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Gate может запретить выпуск</text>
<text x="16" y="529" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в</text>
<text x="16" y="551" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">пояснении урока.</text>
</svg>
