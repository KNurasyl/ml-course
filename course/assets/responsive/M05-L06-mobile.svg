<svg xmlns="http://www.w3.org/2000/svg" width="360" height="532" viewBox="0 0 360 532" role="img" aria-labelledby="M05-L06-mobile-title M05-L06-mobile-desc"><title id="M05-L06-mobile-title">Обучение, выбор и оценка разделены</title><desc id="M05-L06-mobile-desc">Обучение, выбор и оценка разделены. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M05-L06-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M05-L06-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Обучение, выбор и оценка</text>
<text x="16" y="55" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">разделены</text>
<path d="M16,208 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="90" width="3" height="110" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="106" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Train: только fit</text>
<text x="30" y="134" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Медианы → масштаб → категории</text>
<text x="30" y="158" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">→ веса. Один Pipeline для</text>
<text x="30" y="182" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">каждого C.</text>
<path d="M16,318 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="224" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="240" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Validation: выбор</text>
<text x="30" y="268" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Стоимость (2FN + FP) / N.</text>
<text x="30" y="292" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Фиксируем C и порог до test.</text>
<path d="M16,452 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="334" width="3" height="110" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="350" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Test: только predict</text>
<text x="30" y="378" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Ошибки и ограничения</text>
<text x="30" y="402" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">выбранного решения. Обратной</text>
<text x="30" y="426" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">стрелки к выбору нет.</text>
<text x="16" y="480" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Порог и модель зафиксированы</text>
<text x="16" y="502" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">перед независимой оценкой.</text>
</svg>
