<svg xmlns="http://www.w3.org/2000/svg" width="760" height="267" viewBox="0 0 760 267" role="img" aria-labelledby="title desc"><title id="title">LoRA: сумма двух путей</title><desc id="desc">LoRA: сумма двух путей. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="760" height="267" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">LoRA: сумма двух путей</text>
<path d="M16,101 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Замороженный путь</text>
<text x="280" y="79" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">X [N,in] → W [out,in] → XWᵀ + b</text>
<path d="M16,155 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="133" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Обучаемый путь</text>
<text x="280" y="133" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">X → A [rank,in] → B [out,rank] → XAᵀBᵀ · α/rank</text>
<path d="M16,209 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="187" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Сложение</text>
<text x="280" y="187" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Y = XWᵀ + b + XAᵀBᵀ · α/rank</text>
<text x="16" y="237" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Base hash неизменен; ответы могут измениться и ухудшиться.</text>
</svg>
