<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1110" viewBox="0 0 360 1110" role="img" aria-labelledby="M15-L06-mobile-title M15-L06-mobile-desc"><title id="M15-L06-mobile-title">Два времени: аудиосегмент и очередь отменяемых фрагментов</title><desc id="M15-L06-mobile-desc">Два времени: аудиосегмент и очередь отменяемых фрагментов. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M15-L06-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M15-L06-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="30" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="start">Аудио и очередь: два разных</text>
<text x="16" y="58" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="start">времени</text>
<text x="16" y="108" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start">1. Время в аудиофайле</text>
<path d="M26,140 V562" fill="none" style="stroke:var(--accent,#1f55b0)" stroke-width="2"/>
<circle cx="26" cy="150" r="5" style="fill:var(--accent,#1f55b0)"/>
<text x="44" y="155" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">0 мс</text>
<text x="44" y="180" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Речь начинается</text>
<text x="44" y="203" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">partial может изменяться</text>
<circle cx="26" cy="238" r="5" style="fill:var(--accent,#1f55b0)"/>
<text x="44" y="243" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">400 мс</text>
<text x="44" y="268" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Пауза 350 мс</text>
<text x="44" y="291" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">меньше порога 500 мс</text>
<circle cx="26" cy="326" r="5" style="fill:var(--accent,#1f55b0)"/>
<text x="44" y="331" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">750 мс</text>
<text x="44" y="356" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Речь продолжается</text>
<text x="44" y="379" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">та же реплика</text>
<circle cx="26" cy="414" r="5" style="fill:var(--accent,#1f55b0)"/>
<text x="44" y="419" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">1350 мс</text>
<text x="44" y="444" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Начинается тишина</text>
<text x="44" y="467" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">ожидаем 500 мс</text>
<circle cx="26" cy="502" r="5" style="fill:var(--accent,#1f55b0)"/>
<text x="44" y="507" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">1850 мс</text>
<text x="44" y="532" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">endpoint_final</text>
<text x="44" y="555" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">сегмент закрыт</text>
<text x="16" y="630" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start">2. Очередь: активен ход 5</text>
<path d="M16,717 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="16" y="670" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">receive(5, A)</text>
<text x="16" y="695" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">A в очереди</text>
<path d="M16,784 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="16" y="737" style="fill:var(--hint,#9a6410)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">cancel()</text>
<text x="16" y="762" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">A удалён</text>
<path d="M16,851 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="16" y="804" style="fill:var(--hint,#9a6410)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">receive(5, B)</text>
<text x="16" y="829" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">B отклонён как поздний</text>
<path d="M16,918 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="16" y="871" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">begin(7) → receive(7, C)</text>
<text x="16" y="896" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">C принят</text>
<path d="M16,985 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="16" y="938" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">pop()</text>
<text x="16" y="963" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Только C разрешён к выдаче</text>
<text x="16" y="1030" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Метки аудио не измеряют</text>
<text x="16" y="1054" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">задержку ASR, LLM или TTS.</text>
</svg>
