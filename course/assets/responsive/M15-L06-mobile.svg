<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1110" viewBox="0 0 360 1110" role="img" aria-labelledby="title desc"><title id="title">Два времени: аудиосегмент и очередь отменяемых фрагментов</title><desc id="desc">Два времени: аудиосегмент и очередь отменяемых фрагментов. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="1110" fill="white"/>
<text x="16" y="30" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="start">Аудио и очередь: два разных</text>
<text x="16" y="58" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="start">времени</text>
<text x="16" y="108" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start">1. Время в аудиофайле</text>
<path d="M26,140 V562" fill="none" stroke="#245bba" stroke-width="2"/>
<circle cx="26" cy="150" r="5" fill="#245bba"/>
<text x="44" y="155" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">0 мс</text>
<text x="44" y="180" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Речь начинается</text>
<text x="44" y="203" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">partial может изменяться</text>
<circle cx="26" cy="238" r="5" fill="#245bba"/>
<text x="44" y="243" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">400 мс</text>
<text x="44" y="268" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Пауза 350 мс</text>
<text x="44" y="291" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">меньше порога 500 мс</text>
<circle cx="26" cy="326" r="5" fill="#245bba"/>
<text x="44" y="331" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">750 мс</text>
<text x="44" y="356" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Речь продолжается</text>
<text x="44" y="379" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">та же реплика</text>
<circle cx="26" cy="414" r="5" fill="#245bba"/>
<text x="44" y="419" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">1350 мс</text>
<text x="44" y="444" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Начинается тишина</text>
<text x="44" y="467" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">ожидаем 500 мс</text>
<circle cx="26" cy="502" r="5" fill="#245bba"/>
<text x="44" y="507" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">1850 мс</text>
<text x="44" y="532" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">endpoint_final</text>
<text x="44" y="555" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">сегмент закрыт</text>
<text x="16" y="630" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start">2. Очередь: активен ход 5</text>
<path d="M16,717 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="16" y="670" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">receive(5, A)</text>
<text x="16" y="695" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">A в очереди</text>
<path d="M16,784 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="16" y="737" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">cancel()</text>
<text x="16" y="762" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">A удалён</text>
<path d="M16,851 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="16" y="804" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">receive(5, B)</text>
<text x="16" y="829" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">B отклонён как поздний</text>
<path d="M16,918 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="16" y="871" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">begin(7) → receive(7, C)</text>
<text x="16" y="896" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">C принят</text>
<path d="M16,985 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="16" y="938" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start">pop()</text>
<text x="16" y="963" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Только C разрешён к выдаче</text>
<text x="16" y="1030" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Метки аудио не измеряют</text>
<text x="16" y="1054" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">задержку ASR, LLM или TTS.</text>
</svg>
