<svg xmlns="http://www.w3.org/2000/svg" width="360" height="900" viewBox="0 0 360 900" role="img" aria-labelledby="M12-L04-mobile-title M12-L04-mobile-desc"><title id="M12-L04-mobile-title">Низкий ранг: семь обучаемых чисел, двенадцать элементов</title><desc id="M12-L04-mobile-desc">Низкий ранг: семь обучаемых чисел, двенадцать элементов. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M12-L04-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M12-L04-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
