<svg xmlns="http://www.w3.org/2000/svg" width="360" height="495" viewBox="0 0 360 495" role="img" aria-labelledby="M12-L02-mobile-title M12-L02-mobile-desc"><title id="M12-L02-mobile-title">Разбиение целыми сессиями</title><desc id="M12-L02-mobile-desc">Разбиение целыми сессиями. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M12-L02-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M12-L02-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Разбиение целыми сессиями</text>
<path d="M16,133 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="63" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="79" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Сессия A: A1, A2</text>
<text x="30" y="107" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Обе строки в train.</text>
<path d="M16,219 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="149" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="165" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Сессия B: B1, B2</text>
<text x="30" y="193" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Обе строки в train.</text>
<path d="M16,305 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="235" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="251" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Сессия C: C1, C2</text>
<text x="30" y="279" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Обе строки в check.</text>
<path d="M16,415 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="321" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="337" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Группы не пересекаются</text>
<text x="30" y="365" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Train: {A,B}. Check: {C}.</text>
<text x="30" y="389" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Пересечение ∅.</text>
<text x="16" y="443" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Строки одной сессии нельзя</text>
<text x="16" y="465" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">распределять по разным частям.</text>
</svg>
