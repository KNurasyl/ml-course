<svg xmlns="http://www.w3.org/2000/svg" width="360" height="519" viewBox="0 0 360 519" role="img" aria-labelledby="title desc"><title id="title">Контуры данных и модели</title><desc id="desc">Контуры данных и модели. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="519" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Контуры данных и модели</text>
<path d="M16,157 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="63" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Обучение</text>
<text x="30" y="107" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Снимок → preprocessing → веса</text>
<text x="30" y="131" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">→ проверка</text>
<path d="M16,243 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="173" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="189" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Выпуск A</text>
<text x="30" y="217" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">μ=10, s=2, w=3, b=1</text>
<path d="M16,329 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="259" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="275" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Запрос x=14</text>
<text x="30" y="303" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">(14−10)/2=2 → 3×2+1=7</text>
<path d="M16,439 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="345" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="361" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Смешанные версии</text>
<text x="30" y="389" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">μ=12 + старый w → ответ 4</text>
<text x="30" y="413" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">вместо 7</text>
<text x="16" y="467" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в</text>
<text x="16" y="489" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">пояснении урока.</text>
</svg>
