<svg xmlns="http://www.w3.org/2000/svg" width="360" height="412" viewBox="0 0 360 412" role="img" aria-labelledby="M13-L01-mobile-title M13-L01-mobile-desc"><title id="M13-L01-mobile-title">M13-L01 · Версия эксперимента и релиза</title><desc id="M13-L01-mobile-desc">M13-L01 · Версия эксперимента и релиза. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M13-L01-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M13-L01-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">M13-L01 · Версия</text>
<text x="16" y="55" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">эксперимента и релиза</text>
<path d="M16,160 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="90" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="106" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Код: commit + hash</text>
<text x="30" y="134" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Данные: снимок + hash</text>
<path d="M16,246 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="176" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="192" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Веса: файл + hash</text>
<text x="30" y="220" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Prompt и индекс</text>
