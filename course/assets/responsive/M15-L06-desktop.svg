<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="M15-L06-desktop-title M15-L06-desktop-desc"><title id="M15-L06-desktop-title">Два времени: аудиосегмент и очередь отменяемых фрагментов</title><desc id="M15-L06-desktop-desc">Два времени: аудиосегмент и очередь отменяемых фрагментов. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M15-L06-desktop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M15-L06-desktop-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="30" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="650" text-anchor="start">Аудио и очередь: два разных времени</text>
<text x="16" y="83" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="650" text-anchor="start">1. Аудиовремя, мс · порог паузы 500 мс</text>
<rect x="70.0" y="124" width="122.0" height="49" rx="6" style="fill:var(--accent-soft,#e4ecfb)"/>
<text x="78.0" y="154" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Речь</text>
<rect x="194.0" y="124" width="106.5" height="49" rx="6" style="fill:var(--hint-soft,#fbefd6)"/>
<text x="202.0" y="154" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Пауза</text>
<rect x="302.5" y="124" width="184.0" height="49" rx="6" style="fill:var(--accent-soft,#e4ecfb)"/>
<text x="310.5" y="154" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Речь</text>
<rect x="488.5" y="124" width="153.0" height="49" rx="6" style="fill:var(--act-soft,#dff3f2)"/>
<text x="496.5" y="154" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Тишина 500 мс</text>
<path d="M70.0,178 V185" fill="none" style="stroke:var(--muted,#5a6270)" stroke-width="1"/>
<text x="70.0" y="209" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">0</text>
<path d="M194.0,178 V185" fill="none" style="stroke:var(--muted,#5a6270)" stroke-width="1"/>
<text x="194.0" y="209" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">400</text>
<path d="M302.5,178 V185" fill="none" style="stroke:var(--muted,#5a6270)" stroke-width="1"/>
<text x="302.5" y="209" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">750</text>
<path d="M488.5,178 V185" fill="none" style="stroke:var(--muted,#5a6270)" stroke-width="1"/>
<text x="488.5" y="209" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">1350</text>
<path d="M643.5,178 V185" fill="none" style="stroke:var(--muted,#5a6270)" stroke-width="1"/>
<text x="643.5" y="209" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="middle">1850</text>
<path d="M643.5,112 V238" fill="none" style="stroke:var(--act,#0b7478)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="420" y="264" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">endpoint_final: один сегмент</text>
<text x="70" y="240" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">partial → обновляемая гипотеза</text>
<text x="16" y="327" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="650" text-anchor="start">2. Очередь · активен ход 5; события без масштаба времени</text>
<rect x="16" y="365" width="138" height="100" rx="6" style="fill:var(--act-soft,#dff3f2)"/>
<text x="24" y="400" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">receive(5,A)</text>
<text x="24" y="434" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">A в очереди</text>
<path d="M154,479 H161" fill="none" style="stroke:var(--act,#0b7478)" stroke-width="2" marker-end="url(#M15-L06-desktop-arrow)"/>
<rect x="164" y="365" width="138" height="100" rx="6" style="fill:var(--hint-soft,#fbefd6)"/>
<text x="172" y="400" style="fill:var(--hint,#95600f)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">cancel()</text>
<text x="172" y="434" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">A удалён</text>
<path d="M302,479 H309" fill="none" style="stroke:var(--act,#0b7478)" stroke-width="2" marker-end="url(#M15-L06-desktop-arrow)"/>
<rect x="312" y="365" width="138" height="100" rx="6" style="fill:var(--hint-soft,#fbefd6)"/>
<text x="320" y="400" style="fill:var(--hint,#95600f)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">late(5,B)</text>
<text x="320" y="434" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">B отклонён</text>
<path d="M450,479 H457" fill="none" style="stroke:var(--act,#0b7478)" stroke-width="2" marker-end="url(#M15-L06-desktop-arrow)"/>
<rect x="460" y="365" width="138" height="100" rx="6" style="fill:var(--act-soft,#dff3f2)"/>
<text x="468" y="400" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">receive(7,C)</text>
<text x="468" y="434" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">C принят</text>
<path d="M598,479 H605" fill="none" style="stroke:var(--act,#0b7478)" stroke-width="2" marker-end="url(#M15-L06-desktop-arrow)"/>
<rect x="608" y="365" width="138" height="100" rx="6" style="fill:var(--act-soft,#dff3f2)"/>
<text x="616" y="400" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" text-anchor="start">pop()</text>
<text x="616" y="434" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">выдаёт C</text>
<text x="16" y="521" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Перед receive(7,C) начинается ход 7. Отмена очищает очередь.</text>
<text x="16" y="585" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Время аудио и длительность вычисления записываются отдельно.</text>
</svg>
