<svg xmlns="http://www.w3.org/2000/svg" width="360" height="498" viewBox="0 0 360 498" role="img" aria-labelledby="M14-L06-mobile-title M14-L06-mobile-desc"><title id="M14-L06-mobile-title">Разрешение действия отделено от генерации</title><desc id="M14-L06-mobile-desc">Разрешение действия отделено от генерации. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M14-L06-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M14-L06-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Разрешение действия</text>
<text x="16" y="55" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">отделено от генерации</text>
<path d="M16,160 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="90" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="106" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">LLM: предложение</text>
<text x="30" y="134" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">JSON tool + args</text>
<path d="M16,246 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="176" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="192" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Parser: проверка</text>
<text x="30" y="220" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">тип, ключи, допустимые имена</text>
<path d="M16,332 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="262" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="278" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Executor: серверный scope</text>
<text x="30" y="306" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">d1 разрешён / d2 отклонён</text>
<path d="M16,418 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="348" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="364" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Observation → новый вызов</text>
<text x="30" y="392" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">finish, повтор или лимит</text>
<text x="16" y="446" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Сопоставление понятий; строки</text>
<text x="16" y="468" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">не означают поток выполнения.</text>
</svg>
