<svg xmlns="http://www.w3.org/2000/svg" width="360" height="498" viewBox="0 0 360 498" role="img" aria-labelledby="title desc"><title id="title">Разрешение действия отделено от генерации</title><desc id="desc">Разрешение действия отделено от генерации. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="498" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Разрешение действия</text>
<text x="16" y="55" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">отделено от генерации</text>
<path d="M16,160 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="90" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="106" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">LLM: предложение</text>
<text x="30" y="134" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">JSON tool + args</text>
<path d="M16,246 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="176" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="192" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Parser: проверка</text>
<text x="30" y="220" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">тип, ключи, допустимые имена</text>
<path d="M16,332 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="262" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="278" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Executor: серверный scope</text>
<text x="30" y="306" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">d1 разрешён / d2 отклонён</text>
<path d="M16,418 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="348" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="364" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Observation → новый вызов</text>
<text x="30" y="392" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">finish, повтор или лимит</text>
<text x="16" y="446" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Сопоставление понятий; строки</text>
<text x="16" y="468" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">не означают поток выполнения.</text>
</svg>
