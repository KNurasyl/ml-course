<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375" viewBox="0 0 760 375" role="img" aria-labelledby="M15-L04-desktop-title M15-L04-desktop-desc"><title id="M15-L04-desktop-title">Поздний ответ не оживляет отменённый ход</title><desc id="M15-L04-desktop-desc">Поздний ответ не оживляет отменённый ход. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M15-L04-desktop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M15-L04-desktop-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Поздний ответ не оживляет отменённый ход</text>
<path d="M16,101 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="79" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">t0: начат ход 11</text>
<text x="280" y="79" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Вычисление долгое, результат ещё не готов.</text>
<path d="M16,155 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="133" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">t1: отменён ход 11</text>
<text x="280" y="133" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Старые данные уже не вправе звучать.</text>
<path d="M16,209 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="187" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">t2: начат ход 12</text>
<text x="280" y="187" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Вычисление 11 может продолжаться параллельно.</text>
<path d="M16,263 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="241" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">t3: результат 12 готов</text>
<text x="280" y="241" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Проверка идентификатора принимает его.</text>
<path d="M16,317 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="295" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">t4: результат 11 готов</text>
<text x="280" y="295" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Проверка идентификатора отклоняет его.</text>
<text x="16" y="345" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">t0…t4 — порядок событий, не равные интервалы времени.</text>
</svg>
