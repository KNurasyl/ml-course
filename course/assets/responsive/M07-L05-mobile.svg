<svg xmlns="http://www.w3.org/2000/svg" width="360" height="656" viewBox="0 0 360 656" role="img" aria-labelledby="M07-L05-mobile-title M07-L05-mobile-desc"><title id="M07-L05-mobile-title">Сохранение и воспроизведение</title><desc id="M07-L05-mobile-desc">Сохранение и воспроизведение. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M07-L05-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M07-L05-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
