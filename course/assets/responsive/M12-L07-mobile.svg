<svg xmlns="http://www.w3.org/2000/svg" width="360" height="433" viewBox="0 0 360 433" role="img" aria-labelledby="title desc"><title id="title">LoRA: сумма двух путей</title><desc id="desc">LoRA: сумма двух путей. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="433" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">LoRA: сумма двух путей</text>
<path d="M16,157 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="63" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Замороженный путь</text>
<text x="30" y="107" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">X [N,in] → W [out,in] → XWᵀ +</text>
<text x="30" y="131" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">b</text>
<path d="M16,267 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="173" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="189" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Обучаемый путь</text>
<text x="30" y="217" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">X → A [rank,in] → B</text>
<text x="30" y="241" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[out,rank] → XAᵀBᵀ · α/rank</text>
<path d="M16,353 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="283" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="299" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Сложение</text>
<text x="30" y="327" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Y = XWᵀ + b + XAᵀBᵀ · α/rank</text>
<text x="16" y="381" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Base hash неизменен; ответы</text>
<text x="16" y="403" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">могут измениться и ухудшиться.</text>
</svg>
