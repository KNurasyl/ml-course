<text x="320" y="398" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Residual U</text>
<path d="M722,322 H742 V455 H400 V486" fill="none" style="stroke:var(--act,#0b7478)" stroke-width="2" marker-end="url(#M08-L07-desktop-arrow)"/>
<rect x="280" y="494" width="250" height="75" rx="6" style="fill:var(--accent-soft,#e4ecfb);stroke:var(--accent,#1f55b0)"/>
<text x="294" y="525" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">Y = U + MLP(…)</text>
<text x="294" y="551" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B, T, D]</text>
<text x="16" y="607" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">MLP: [B,T,D] → [B,T,H] → [B,T,D]. Позиции не смешиваются.</text>
<path d="M16,644 H62" fill="none" style="stroke:var(--accent,#1f55b0)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="75" y="650" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Пунктир: прямой путь данных к сложению.</text>
<text x="16" y="700" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start">Y поступает в следующий блок; форма входа и выхода совпадает.</text>
