<text x="200" y="208" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Q/K/V: [B,T,D] → scores: [B,T,T] → AV: [B,T,D]</text>
<rect x="16" y="285" width="130" height="75" rx="6" style="fill:var(--accent-soft,#e4ecfb);stroke:var(--accent,#1f55b0)"/>
<text x="30" y="316" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">U</text>
<text x="30" y="342" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B, T, D]</text>
<rect x="196" y="285" width="185" height="75" rx="6" style="fill:var(--act-soft,#dff3f2);stroke:var(--act,#0b7478)"/>
<text x="210" y="316" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">LayerNorm₂</text>
<text x="210" y="342" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">форма сохраняется</text>
<rect x="430" y="285" width="205" height="75" rx="6" style="fill:var(--act-soft,#dff3f2);stroke:var(--act,#0b7478)"/>
<text x="444" y="316" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">MLP</text>
<text x="444" y="342" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Linear → GELU → Linear</text>
