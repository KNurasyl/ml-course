<svg xmlns="http://www.w3.org/2000/svg" width="760" height="750" viewBox="0 0 760 750" role="img" aria-labelledby="M08-L07-desktop-title M08-L07-desktop-desc"><title id="M08-L07-desktop-title">Pre-norm Transformer: вход, операции, residual и выход</title><desc id="M08-L07-desktop-desc">Pre-norm Transformer: вход, операции, residual и выход. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M08-L07-desktop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M08-L07-desktop-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="30" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650" text-anchor="start">Pre-norm Transformer</text>
<text x="16" y="58" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Одна учебная attention-head</text>
<rect x="16" y="102" width="130" height="75" rx="6" style="fill:var(--accent-soft,#e4ecfb);stroke:var(--accent,#1f55b0)"/>
<text x="30" y="133" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">X</text>
<text x="30" y="159" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B, T, D]</text>
<rect x="196" y="102" width="185" height="75" rx="6" style="fill:var(--act-soft,#dff3f2);stroke:var(--act,#0b7478)"/>
<text x="210" y="133" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">LayerNorm₁</text>
<text x="210" y="159" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">форма сохраняется</text>
<rect x="430" y="102" width="205" height="75" rx="6" style="fill:var(--act-soft,#dff3f2);stroke:var(--act,#0b7478)"/>
<text x="444" y="133" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start">Causal attention</text>
<text x="444" y="159" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">смешивает позиции</text>
