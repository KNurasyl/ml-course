<svg xmlns="http://www.w3.org/2000/svg" width="360" height="581" viewBox="0 0 360 581" role="img" aria-labelledby="title desc"><title id="title">Что именно оцениваем</title><desc id="desc">Что именно оцениваем. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="581" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Что именно оцениваем</text>
<path d="M16,133 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="63" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">20 запросов</text>
<text x="30" y="107" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">15 ответов +5 отказов</text>
<path d="M16,219 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="149" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="165" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Корректность среди ответов</text>
<text x="30" y="193" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">12/15 =80%</text>
<path d="M16,305 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="235" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="251" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Покрытие</text>
<text x="30" y="279" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">15/20 =75%</text>
<path d="M16,391 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="321" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="337" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Корректный ответ для запроса</text>
<text x="30" y="365" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">12/20 =60%</text>
<path d="M16,501 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="407" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="423" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Отказы</text>
<text x="30" y="451" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Нужна отдельная разметка</text>
<text x="30" y="475" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">уместности</text>
<text x="16" y="529" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в</text>
<text x="16" y="551" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">пояснении урока.</text>
</svg>
