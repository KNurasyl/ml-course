<svg xmlns="http://www.w3.org/2000/svg" width="760" height="393" viewBox="0 0 760 393" role="img" aria-labelledby="title desc"><title id="title">Тема и номер операции не совпадают</title><desc id="desc">Тема и номер операции не совпадают. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="760" height="393" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Тема и номер операции не совпадают</text>
<path d="M16,125 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">topic 0, turn 0,</text>
<text x="18" y="103" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">основной</text>
<text x="280" y="79" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">короткий ответ → уточнить</text>
<path d="M16,203 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="157" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">topic 0, turn 1,</text>
<text x="18" y="181" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">уточнение</text>
<text x="280" y="157" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">любой ответ → следующая тема</text>
<path d="M16,281 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="235" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">topic 1, turn 2,</text>
<text x="18" y="259" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">основной</text>
<text x="280" y="235" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">отказ → тема 2 без уточнения</text>
<path d="M16,335 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="313" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">после темы 3</text>
<text x="280" y="313" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">finished; нового вопроса нет</text>
<text x="16" y="363" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Сопоставление понятий; строки не означают поток выполнения.</text>
</svg>
