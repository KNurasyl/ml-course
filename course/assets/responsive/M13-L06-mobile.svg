<svg xmlns="http://www.w3.org/2000/svg" width="360" height="546" viewBox="0 0 360 546" role="img" aria-labelledby="title desc"><title id="title">A и B: одна работа, разное ожидание</title><desc id="desc">A и B: одна работа, разное ожидание. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="546" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">A и B: одна работа, разное</text>
<text x="16" y="55" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">ожидание</text>
<path d="M16,184 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="90" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="106" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">A: очередь 0 мс</text>
<text x="30" y="134" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">работа 0–80 → ответ около 80</text>
<text x="30" y="158" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">мс</text>
<path d="M16,294 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="200" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="216" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">B: очередь 0–80 мс</text>
<text x="30" y="244" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">работа 80–160 → ответ около</text>
<text x="30" y="268" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">160 мс</text>
<path d="M16,380 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="310" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="326" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">B с дедлайном 10 мс</text>
<text x="30" y="354" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">отказ до вычисления</text>
<path d="M16,466 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="396" width="3" height="62" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="412" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">C при вместимости 2</text>
<text x="30" y="440" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">переполнение → 503</text>
<text x="16" y="494" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Сопоставление понятий; строки</text>
<text x="16" y="516" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">не означают поток выполнения.</text>
</svg>
