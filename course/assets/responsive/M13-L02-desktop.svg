<svg xmlns="http://www.w3.org/2000/svg" width="760" height="267" viewBox="0 0 760 267" role="img" aria-labelledby="M13-L02-desktop-title M13-L02-desktop-desc"><title id="M13-L02-desktop-title">M13-L02 · Упаковка и контракт</title><desc id="M13-L02-desktop-desc">M13-L02 · Упаковка и контракт. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M13-L02-desktop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M13-L02-desktop-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
