<circle cx="157" cy="410" r="21" fill="#edf8f7"/>
<text x="157" y="417" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" text-anchor="middle">+</text>
<rect x="42" y="468" width="230" height="64" rx="6" fill="#eef4fc" stroke="#245bba"/>
<text x="57" y="495" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">U = X + Attention(…)</text>
<text x="57" y="518" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B, T, D]</text>
<rect x="42" y="570" width="230" height="64" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="57" y="597" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">LayerNorm₂</text>
<text x="57" y="620" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">форма сохраняется</text>
<rect x="42" y="672" width="230" height="64" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="57" y="699" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">MLP: Linear → GELU</text>
