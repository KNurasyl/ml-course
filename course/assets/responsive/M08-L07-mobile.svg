<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="title desc"><title id="title">Pre-norm Transformer: вход, операции, residual и выход</title><desc id="desc">Pre-norm Transformer: вход, операции, residual и выход. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="1120" fill="white"/>
<text x="16" y="30" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="650" text-anchor="start">Pre-norm Transformer</text>
<text x="16" y="58" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Одна учебная attention-head</text>
