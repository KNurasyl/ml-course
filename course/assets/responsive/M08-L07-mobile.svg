<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1120" viewBox="0 0 360 1120" role="img" aria-labelledby="M08-L07-mobile-title M08-L07-mobile-desc"><title id="M08-L07-mobile-title">Pre-norm Transformer: вход, операции, residual и выход</title><desc id="M08-L07-mobile-desc">Pre-norm Transformer: вход, операции, residual и выход. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M08-L07-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M08-L07-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
