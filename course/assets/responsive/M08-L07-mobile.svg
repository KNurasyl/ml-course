<text x="57" y="111" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">X</text>
<text x="57" y="134" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B, T, D]</text>
