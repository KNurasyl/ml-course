<text x="157" y="801" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="600" text-anchor="middle">+</text>
<rect x="42" y="852" width="230" height="64" rx="6" fill="#eef4fc" stroke="#245bba"/>
<text x="57" y="879" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">Y = U + MLP(…)</text>
<text x="57" y="902" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B, T, D]</text>
<text x="16" y="957" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Attention смешивает позиции.</text>
<text x="16" y="981" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">MLP меняет признаки каждой</text>
<text x="16" y="1005" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">позиции.</text>
<path d="M16,1030 H54" fill="none" stroke="#245bba" stroke-width="2" stroke-dasharray="6 5"/>
<text x="65" y="1036" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Residual: исходные данные</text>
<text x="16" y="1074" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Y поступает в следующий блок.</text>
