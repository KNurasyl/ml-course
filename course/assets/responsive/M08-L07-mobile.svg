<text x="57" y="879" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">Y = U + MLP(…)</text>
<text x="57" y="902" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B, T, D]</text>
<text x="16" y="957" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Attention смешивает позиции.</text>
<text x="16" y="981" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">MLP меняет признаки каждой</text>
<text x="16" y="1005" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">позиции.</text>
<path d="M16,1030 H54" fill="none" style="stroke:var(--accent,#1f55b0)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="65" y="1036" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">Residual: исходные данные</text>
<text x="16" y="1074" style="fill:var(--act,#0b7478)" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start">Y поступает в следующий блок.</text>
