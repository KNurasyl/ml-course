<text x="57" y="212" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">LayerNorm₁</text>
<text x="57" y="235" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">форма сохраняется</text>
