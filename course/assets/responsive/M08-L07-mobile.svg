<text x="57" y="313" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start">Causal attention</text>
<text x="57" y="336" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start">[B,T,T] @ [B,T,D]</text>
