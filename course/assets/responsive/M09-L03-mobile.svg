<svg xmlns="http://www.w3.org/2000/svg" width="360" height="605" viewBox="0 0 360 605" role="img" aria-labelledby="M09-L03-mobile-title M09-L03-mobile-desc"><title id="M09-L03-mobile-title">Генерация и ограничения</title><desc id="M09-L03-mobile-desc">Генерация и ограничения. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M09-L03-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M09-L03-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" text-anchor="start">Генерация и ограничения</text>
<path d="M16,133 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="63" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="79" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Исходно</text>
<text x="30" y="107" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[0,60;0,25;0,10;0,05]</text>
<path d="M16,219 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="149" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="165" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Top-k=2</text>
<text x="30" y="193" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Оставить два самых вероятных</text>
<path d="M16,329 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="235" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="251" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Top-p=0,8</text>
<text x="30" y="279" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">0,60 мало; 0,60+0,25</text>
<text x="30" y="303" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">достаточно</text>
<path d="M16,415 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="345" width="3" height="62" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="361" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Перенормировка</text>
<text x="30" y="389" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">[0,7059;0,2941;0;0]</text>
<path d="M16,525 H344" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<rect x="16" y="431" width="3" height="86" rx="0" style="fill:var(--accent,#1f55b0)"/>
<text x="30" y="447" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Качество текста</text>
<text x="30" y="475" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Проверяется отдельно по</text>
