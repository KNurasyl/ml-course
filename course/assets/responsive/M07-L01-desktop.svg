<svg xmlns="http://www.w3.org/2000/svg" width="760" height="375" viewBox="0 0 760 375" role="img" aria-labelledby="M07-L01-desktop-title M07-L01-desktop-desc"><title id="M07-L01-desktop-title">Линейный слой и нелинейность</title><desc id="M07-L01-desktop-desc">Линейный слой и нелинейность. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M07-L01-desktop-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M07-L01-desktop-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
<text x="16" y="28" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Линейный слой и нелинейность</text>
<path d="M16,101 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="79" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">X: [B,3]</text>
<text x="280" y="79" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">B объектов, по 3 признака</text>
<path d="M16,155 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="133" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Linear(3,4)</text>
<text x="280" y="133" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">W: [4,3], b: [4], 16 параметров</text>
<path d="M16,209 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="187" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">ReLU</text>
<text x="280" y="187" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Отрицательные значения становятся нулём</text>
<path d="M16,263 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="241" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Linear(4,2)</text>
<text x="280" y="241" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">W: [2,4], b: [2], 10 параметров</text>
<path d="M16,317 H744" fill="none" style="stroke:var(--line,#d9d6cd)" stroke-width="1"/>
<text x="18" y="295" style="fill:var(--accent,#1f55b0)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Выход: [B,2]</text>
<text x="280" y="295" style="fill:var(--ink,#1d2430)" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Две оценки класса на каждый объект</text>
<text x="16" y="345" style="fill:var(--muted,#5a6270)" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в пояснении урока.</text>
</svg>
