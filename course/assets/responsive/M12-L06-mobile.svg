<svg xmlns="http://www.w3.org/2000/svg" width="360" height="659" viewBox="0 0 360 659" role="img" aria-labelledby="title desc"><title id="title">Assistant-only loss: контекст виден, loss избирателен</title><desc id="desc">Assistant-only loss: контекст виден, loss избирателен. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="360" height="659" fill="white"/>
