<svg xmlns="http://www.w3.org/2000/svg" width="360" height="659" viewBox="0 0 360 659" role="img" aria-labelledby="M12-L06-mobile-title M12-L06-mobile-desc"><title id="M12-L06-mobile-title">Assistant-only loss: контекст виден, loss избирателен</title><desc id="M12-L06-mobile-desc">Assistant-only loss: контекст виден, loss избирателен. Подписи и числа поясняют значения цвета.</desc><defs><marker id="M12-L06-mobile-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--act,#0b7478)"/></marker><marker id="M12-L06-mobile-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" style="fill:var(--accent,#1f55b0)"/></marker></defs>
