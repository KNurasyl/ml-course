<svg xmlns="http://www.w3.org/2000/svg" width="760" height="367" viewBox="0 0 760 367" role="img" aria-labelledby="title desc"><title id="title">Биграмма видит предыдущий символ</title><desc id="desc">Биграмма видит предыдущий символ. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="760" height="367" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Биграмма видит предыдущий символ</text>
<path d="M16,101 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Цепочка символов</text>
<text x="280" y="79" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">^ → a → b → a → b → $</text>
<path d="M16,155 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="133" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Пара a → b</text>
<text x="280" y="133" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Обучается вероятность b по строке W[a].</text>
<path d="M16,209 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="187" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Алфавит: ^ a b c $</text>
<text x="280" y="187" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">W имеет форму [5,5] = 25 весов.</text>
<path d="M16,287 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="241" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Предел контекста</text>
<text x="280" y="241" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">aba и aaaa оканчиваются на a: используется одна</text>
<text x="280" y="265" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">строка W[a].</text>
<text x="16" y="315" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Transformer получает доступный контекст через attention; биграмма его не</text>
<text x="16" y="337" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">видит.</text>
</svg>
