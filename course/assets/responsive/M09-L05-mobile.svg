<rect x="16" y="369" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="385" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Актуальность</text>
<text x="30" y="413" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">session / turn /</text>
<text x="30" y="437" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">generation_id</text>
<path d="M16,573 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="479" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="495" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Ошибка любого этапа</text>
<text x="30" y="523" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Явное состояние; не</text>
<text x="30" y="547" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">выдумывать score</text>
<text x="16" y="601" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Учебные числа и условия — в</text>
