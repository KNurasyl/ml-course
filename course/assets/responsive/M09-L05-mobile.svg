<rect x="16" y="149" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="165" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Схема</text>
<text x="30" y="193" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Ключи + типы + непустой</text>
<text x="30" y="217" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">feedback</text>
<path d="M16,353 H344" fill="none" stroke="#ccd6df" stroke-width="1"/>
<rect x="16" y="259" width="3" height="86" rx="0" fill="#245bba" stroke="none"/>
<text x="30" y="275" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Предметный смысл</text>
<text x="30" y="303" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Подтверждение оценки по</text>
<text x="30" y="327" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">рубрике</text>
