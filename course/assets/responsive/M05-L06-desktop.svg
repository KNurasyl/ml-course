<svg xmlns="http://www.w3.org/2000/svg" width="760" height="339" viewBox="0 0 760 339" role="img" aria-labelledby="title desc"><title id="title">Обучение, выбор и оценка разделены</title><desc id="desc">Обучение, выбор и оценка разделены. Подписи и числа поясняют значения цвета.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker><marker id="blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#245bba"/></marker></defs><rect width="760" height="339" fill="white"/>
<text x="16" y="28" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650" text-anchor="start">Обучение, выбор и оценка разделены</text>
<path d="M16,125 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="79" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Train: только fit</text>
<text x="280" y="79" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Медианы → масштаб → категории → веса. Один</text>
<text x="280" y="103" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Pipeline для каждого C.</text>
<path d="M16,203 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="157" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Validation: выбор</text>
<text x="280" y="157" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Стоимость (2FN + FP) / N. Фиксируем C и порог до</text>
<text x="280" y="181" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">test.</text>
<path d="M16,281 H744" fill="none" stroke="#ccd6df" stroke-width="1"/>
<text x="18" y="235" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start">Test: только predict</text>
<text x="280" y="235" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Ошибки и ограничения выбранного решения.</text>
<text x="280" y="259" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start">Обратной стрелки к выбору нет.</text>
<text x="16" y="309" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="400" text-anchor="start">Порог и модель зафиксированы перед независимой оценкой.</text>
</svg>
