<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 490" role="img" aria-labelledby="title"><title id="title">Текст и токены</title><rect width="1040" height="490" fill="#f5f7fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="32" y="44" font-size="25" fill="#182b49">Текст и токены</text><rect x="30" y="72" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="105" font-size="19" fill="#15457e">Строка</text><path d="M340 99h28" stroke="#47749e" stroke-width="3"/><path d="M361 93l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="105" font-size="18" fill="#182b49">«кот» — 3 символа</text><rect x="30" y="140" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="173" font-size="19" fill="#15457e">Словарь</text><path d="M340 167h28" stroke="#47749e" stroke-width="3"/><path d="M361 161l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="173" font-size="18" fill="#182b49">0=пробел, 1=к, 2=о, 3=т</text><rect x="30" y="208" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="241" font-size="19" fill="#15457e">Идентификаторы</text><path d="M340 235h28" stroke="#47749e" stroke-width="3"/><path d="M361 229l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="241" font-size="18" fill="#182b49">[1, 2, 3] — адреса, не смысловые числа</text><rect x="30" y="276" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="309" font-size="19" fill="#15457e">Next-token цель</text><path d="M340 303h28" stroke="#47749e" stroke-width="3"/><path d="M361 297l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="309" font-size="18" fill="#182b49">input [1,2] → target [2,3]</text><rect x="30" y="344" width="300" height="54" rx="8" fill="#dde9fb"/><text x="44" y="377" font-size="19" fill="#15457e">Настоящая LLM</text><path d="M340 371h28" stroke="#47749e" stroke-width="3"/><path d="M361 365l9 6-9 6" fill="none" stroke="#47749e" stroke-width="3"/><text x="385" y="377" font-size="18" fill="#182b49">Считать её tokenizer, не длину строки</text><text x="32" y="466" font-size="16" fill="#536780">Учебный пример: числа заданы для разбора механизма.</text></g></svg>
