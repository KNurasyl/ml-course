<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><title>Две независимые оси приёмки</title><rect width="960" height="460" rx="16" fill="#f4f7fb"/><text x="28" y="42" font-size="24" font-family="Arial" fill="#183f38">Две независимые оси приёмки</text><rect x="28" y="75" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="112" font-size="19" font-family="Arial">Техническая связность</text><text x="440" y="112" font-size="18" font-family="Arial">turn, очередь, отмена, восстановление</text><rect x="28" y="150" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="187" font-size="19" font-family="Arial">HR: качество</text><text x="440" y="187" font-size="18" font-family="Arial">личное действие, основание, next step</text><rect x="28" y="225" width="904" height="62" rx="8" fill="#e1eddd"/><text x="46" y="262" font-size="19" font-family="Arial">Backend: качество</text><text x="440" y="262" font-size="18" font-family="Arial">факт, условие, источник, компромисс</text><rect x="28" y="300" width="904" height="62" rx="8" fill="#e8ebf5"/><text x="46" y="337" font-size="19" font-family="Arial">Новая самостоятельная задача</text><text x="440" y="337" font-size="18" font-family="Arial">сохранение между процессами</text><text x="30" y="438" font-size="17" font-family="Arial" fill="#425f64">Запускаемое приложение + свидетельства + самостоятельная защита.</text></svg>
