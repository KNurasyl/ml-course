<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-labelledby="title desc">
<title id="title">Один пайплайн — четыре эмбеддера</title>
<desc id="desc">Одинаковые документы, фрагменты и запросы проходят через четыре эмбеддера с собственным pooling; ранжирование и метрики одинаковы для всех. Справа — стоимость и предупреждение о пороге сходства. Подписи и числа поясняют значения цвета.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#087e82"/></marker></defs>
<rect width="760" height="470" fill="white"/>
<text x="16" y="34" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="650">Один пайплайн — четыре эмбеддера</text>
<rect x="16" y="56" width="520" height="54" rx="6" fill="#eef4fc" stroke="#245bba"/>
<text x="30" y="80" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Одни и те же данные для всех моделей</text>
<text x="30" y="101" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15">24 документа, те же абзацы, 48 + 12 запросов с ответом</text>
<path d="M276,110 V132" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="138" width="124" height="74" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="26" y="160" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">MiniLM</text>
<text x="26" y="180" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">mean · 384</text>
<text x="26" y="198" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="13">английская</text>
<rect x="148" y="138" width="124" height="74" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="158" y="160" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">USER-bge-m3</text>
<text x="158" y="180" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">CLS · 1024</text>
<text x="158" y="198" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">русская</text>
<rect x="280" y="138" width="124" height="74" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="290" y="160" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">bge-m3</text>
<text x="290" y="180" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">CLS · 1024</text>
<text x="290" y="198" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">многоязычная</text>
<rect x="412" y="138" width="124" height="74" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="422" y="160" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Qwen3-Emb.</text>
<text x="422" y="180" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">last token</text>
<text x="422" y="198" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="13">prompt запроса</text>
<path d="M276,212 V234" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="240" width="520" height="54" rx="6" fill="#eef4fc" stroke="#245bba"/>
<text x="30" y="264" fill="#245bba" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">cosine → ранжирование фрагментов</text>
<text x="30" y="285" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15">фрагменты схлопываются в документы</text>
<path d="M276,294 V316" fill="none" stroke="#087e82" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="16" y="322" width="520" height="54" rx="6" fill="#edf8f7" stroke="#087e82"/>
<text x="30" y="346" fill="#087e82" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="600">Одинаковые метрики для всех</text>
<text x="30" y="367" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="15">Recall@1, @3, @5 и MRR по стилю запроса</text>
<rect x="556" y="138" width="188" height="156" rx="6" fill="#fff3e5" stroke="#a65c12"/>
<text x="568" y="162" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Стоимость</text>
<text x="568" y="186" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">размер на диске</text>
<text x="568" y="208" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">время загрузки</text>
<text x="568" y="230" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">время кодирования</text>
<text x="568" y="252" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">размер вектора:</text>
<text x="568" y="274" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="14">N · d · 4 байта</text>
<rect x="556" y="306" width="188" height="70" rx="6" fill="#fff3e5" stroke="#a65c12"/>
<text x="568" y="330" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">Ближайший ≠</text>
<text x="568" y="352" fill="#a65c12" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600">подходящий</text>
<text x="568" y="370" fill="#182b3a" font-family="Segoe UI,Arial,sans-serif" font-size="12">порог не переносится</text>
<text x="16" y="412" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="14">Pooling и prompt берутся из конфигурации модели: другой способ свёртки молча портит векторы.</text>
<text x="16" y="436" fill="#526474" font-family="Segoe UI,Arial,sans-serif" font-size="14">Лексические TF-IDF и BM25 остаются в таблице как ориентир.</text>
</svg>
