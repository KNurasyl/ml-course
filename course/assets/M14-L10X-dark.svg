<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc"><!-- Dark copy of M14-L10X.svg, generated by tools/build_dark_figures.py (D4). Edit the light file. -->
<title id="title">Workflow или агент</title>
<desc id="desc">Сверху — кто ведёт процесс. В агенте модель на каждом шаге сама выбирает следующий вызов, пока не вызовет finish. В workflow модель один раз выбирает маршрут, схема маршрута проверяет его, код вызывает один инструмент, модель пишет ответ, а код-оценщик по результату инструмента отправляет замечание, не больше двух раундов. Снизу — сколько задач решено на тех же семи простых и трёх составных задачах. 0.5B: агент M14-L09X — решено 0 из 7, вызовов модели 35; цепочка — решено 2 из 7, вызовов модели 14; цепочка с оценщиком — решено 3 из 7, вызовов модели 24; агент на составных — решено 0 из 3, вызовов модели 24; оркестратор — решено 0 из 3, вызовов модели 21. 4B: агент M14-L09X — решено 6 из 7, вызовов модели 16; цепочка — решено 6 из 7, вызовов модели 14; цепочка с оценщиком — решено 6 из 7, вызовов модели 16; агент на составных — решено 2 из 3, вызовов модели 11; оркестратор — решено 2 из 3, вызовов модели 9.</desc>
