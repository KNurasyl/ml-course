      - {id: MP1-S3, result: "третья конфигурация (ru-8b после подтверждения автора, пока — 4B на CPU с отметкой в выводе): 20 ответов и замеры"}
      - {id: MP1-S4, result: "свой разбор JSON: доля валидного JSON и доля верных категорий против expected по каждой конфигурации"}
      - {id: MP1-S5, result: "рубрика качества 0–2 в поле rubric, оценка каждого ответа и среднее по конфигурациям"}
      - {id: MP1-S6, result: "вывод «какую беру и почему» от 40 слов: выбранная конфигурация и цена выбора"}
