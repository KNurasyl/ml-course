# Маршрут 2.0 «LLM-инженер: от модели до сервера» (REFACTORING_PLAN_2.0.md, раздел 4, задача R02).
# Канон уровней, уроков, миссий и статусов. Уроки не переписываются: маршрут лежит поверх них.
# Проверяется tools/validate_course.py --require-local (_validate_route_v2) и tests/test_route_v2.py.
#
# Статус урока: core — урок упомянут в одном из уровней; library — в списке library.
# Каждый урок curriculum.json и каждое вводное занятие P01-P10 имеет ровно один статус.
# planned: Rxx — урок или материал ещё не написан; флаг снимается задачей Rxx, когда файл появляется.
# when (только уровень 3): always — пройти; rubric_gap — открыть, если пункт рубрики M10-HW01 ниже 2;
# as_needed — по необходимости проекта. Миссий у таких уроков нет: работу ведёт быстрый вход.
#
# Миссия — одно занятие на 30–45 минут (course/tutor-protocol.md). id миссии — это id задачи в
# progress/progress.jsonl (tools/progress.py add <id>). Виды миссий:
#   entry  — (а) вход: задача из разобранного примера на новых числах, затем разбор;
#   own    — (б) своя работа: задача A, затем вариант B из «Новой и отложенной проверки»;
#   lab    — (в) опыт: «предскажи до запуска» на лабораторной (lab) урока или модуля;
#   launch — уровень 0: только запуск; command — команда запуска, которую тьютор даёт ученику;
#   project — мини-проект уровня. Если у проекта есть sessions, он разбит на занятия <id>-S1, <id>-S2…
#             с одним результатом (result) на занятие; сам проект (<id>) пройден, только когда его check.py
#             зелёный — это записывает tools/progress.py check <id>, а не обычная запись add.
version: 2
created: 2026-11-18
mission_minutes: [30, 45]
# Модель по умолчанию для занятий выбрана по замеру железа 18.11.2026 (R06, quality/hardware/baseline.json):
# Qwen3.5-4B Q4_K_M целиком на GPU — около 47 токенов/с и 0,15 с до первого токена против 5,9 токенов/с на CPU;
# при контексте 8192 занимает 2991 МиБ из 3243 свободных. 16384 не помещается с запасом. Для тестов по-прежнему 0.5B (И9).
session_model:
  profile: qwen3.5-4b-q4_k_m-gpu
  gguf: qwen3.5-4b-q4_k_m
  runtime: runtime/llama.cpp/b11803-cuda  # python tools/hardware_baseline.py fetch-cuda
  server_args: ["-ngl", "99", "-c", "8192", "--parallel", "1"]
  chat_template_kwargs: {enable_thinking: false}
  # Запасной вариант на CPU (И7): та же модель на CPU — 5,9 токенов/с; для быстрых миссий — 0.5B на CPU, 42 токена/с.
  fallback_cpu: {gguf: qwen2.5-0.5b-instruct-q4_k_m, runtime: runtime/llama.cpp/b11803, server_args: ["-ngl", "0"]}
  evidence: quality/hardware/baseline.json
levels:
- level: 0
  title: Первый запуск
  hours: 2
  outcome: "Запустить модель и вызвать её из своего кода"
  card: "Qwen через llama-server"  # короткая подпись проекта для карты прогресса
  project:
    id: MP0
    title: "Поднять Qwen через llama-server и отправить запрос из своего кода (Python или TS)"
    missions: [MP0]
    path: labs/M09/README.md
  lessons:
    - lesson: M09-L07X  # только запуск
      missions:
        - {id: M09-L07X-M0, kind: launch, file: course/lessons/M09-L07X.md, section: Разобранный пример, lab: labs/M09/llama_local.py,
           command: '.\.venv\Scripts\python.exe labs\M09\llama_local.py serve --gpu'}  # session_model: runtime, gguf и server_args выше
- level: 1
  title: Модели и запуск
  hours: 20
  outcome: "Выбирать и запускать модели"
  card: "MP1 «Паспорт моделей»"  # короткая подпись проекта для карты прогресса
