<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Порог и стоимость ошибок</title><link rel="stylesheet" href="theme-tokens.css"><link rel="stylesheet" href="visual-style.css"></head><body><main><span class="tag">M05 · Решения и цена ошибки</span><h1>Порог меняет решения</h1><p class="question">Модель и вероятности зафиксированы. Предскажи, какую ошибку уберёт снижение порога.</p><div class="two-controls"><div class="control"><label for="t"><span>Порог</span><output id="t-value" for="t">0.50</output></label><input id="t" type="range" min="0.05" max="0.95" step="0.05" value="0.5"></div><div class="control"><label for="cost"><span>Цена FN</span><output id="cost-value" for="cost">2</output></label><input id="cost" type="range" min="1" max="5" step="1" value="2"></div></div><div id="figure" class="figure"></div><p id="out" class="result" role="status" aria-live="polite"></p><button id="reset" type="button">Исходное значение</button><p class="limit"><strong>Граница модели.</strong> Четыре синтетических примера. Цена FP = 1, цена FN задаётся ползунком. Правило: p ≥ порога.</p></main><script>
const t=document.querySelector('#t'),cost=document.querySelector('#cost'),out=document.querySelector('#out'),figure=document.querySelector('#figure');
function draw(){let p=[.4,.3,.8,.6],y=[1,0,1,0],pred=p.map(v=>v>=+t.value?1:0),fn=y.filter((v,i)=>v===1&&pred[i]===0).length,fp=y.filter((v,i)=>v===0&&pred[i]===1).length;document.querySelector('#t-value').textContent=(+t.value).toFixed(2);document.querySelector('#cost-value').textContent=cost.value;
figure.innerHTML='<div class="mini-grid">'+p.map((prob,i)=>{const correct=pred[i]===y[i],type=correct?'Верно':y[i]===1?'FN · пропущен +':'FP · ложный +';return `<div class="datum ${correct?'selected':'warn'}"><strong>Пример ${i+1} · p = ${prob}</strong><p>y = ${y[i]} → прогноз ${pred[i]}<br>${type}</p></div>`;}).join('')+'</div>';
out.textContent=`FN = ${fn}; FP = ${fp}.\nСредняя стоимость = (${cost.value} × ${fn} + ${fp}) / 4 = ${((+cost.value*fn+fp)/4).toFixed(3)}.\nВеса модели и вероятности не менялись.`;}
t.oninput=cost.oninput=draw;document.querySelector('#reset').onclick=()=>{t.value=.5;cost.value=2;draw()};draw();
</script><script src="visual-frame.js"></script></body></html>
