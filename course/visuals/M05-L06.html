<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Порог и стоимость ошибок</title><style>body{font:17px/1.6 Arial;background:#f5f7ee;color:#243c35;padding:20px}main{max-width:780px;margin:auto}label{display:block}input{width:100%}pre{white-space:pre-wrap;background:white;padding:16px}button{padding:9px;font:inherit}table{border-collapse:collapse}td,th{padding:8px;border:1px solid #b8c5b2}</style><main><h1>Порог и стоимость ошибок</h1><p>Модель и вероятности зафиксированы. Меняется ли обучение весов, когда ты двигаешь порог?</p><p>y=[1,0,1,0], p=[0.4,0.3,0.8,0.6]. Правило p≥порог.</p><label>Порог <input id="t" type="range" min="0.05" max="0.95" step="0.05" value="0.5"></label><label>Цена FN <input id="cost" type="range" min="1" max="5" step="1" value="2"></label><pre id="out" aria-live="polite"></pre><button id="reset">Исходное значение</button><p>Сначала предскажи результат, затем измени параметр и объясни расхождение. Это численный опыт, не измерение качества интервьюера.</p></main><script>const t=document.querySelector('#t'),cost=document.querySelector('#cost'),out=document.querySelector('#out');function draw(){let p=[.4,.3,.8,.6],y=[1,0,1,0],pred=p.map(v=>v>=+t.value?1:0),fn=y.filter((v,i)=>v===1&&pred[i]===0).length,fp=y.filter((v,i)=>v===0&&pred[i]===1).length;out.textContent=`Порог=${(+t.value).toFixed(2)}
Решения=[${pred}]
FN=${fn}; FP=${fp}
Стоимость=(${cost.value}×${fn}+${fp})/4=${((+cost.value*fn+fp)/4).toFixed(3)}
Веса и вероятности не менялись.`;}t.oninput=cost.oninput=draw;document.querySelector('#reset').onclick=()=>{t.value=.5;cost.value=2;draw()};draw();</script></html>
