<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Граница уточнений</title><style>body{font:16px/1.55 Arial;margin:18px;background:#f5f8f4;color:#183f38}h1{font-size:23px}label{display:block;margin:12px 0}input[type=range]{width:220px}select,button{font:inherit;padding:6px;max-width:100%}svg{width:100%;height:auto;min-height:200px;background:white}#result{padding:12px;background:#e4eddf}button:focus,input:focus,select:focus{outline:3px solid #ce9c40}@media(max-width:500px){svg{display:none}#rows{display:block}}#rows{padding-left:22px}#rows li{margin:5px 0}</style><h1>Граница уточнений</h1><p>Две темы. Выбери тип ответа и нажимай следующий ход; предсказывай, изменится ли тема. Это эвристика полноты, не оценка кандидата.</p><label>Лимит уточнений <input id="limit" type="range" min="0" max="2" value="1"></label><label>Ответ <select id="answer"><option value="short">короткий / не знаю</option><option value="long">длинный</option><option value="refuse">не хочу отвечать</option></select></label><button id="step">Принять ответ</button><button id="reset">Сначала</button><svg viewBox="0 0 820 300" role="img" aria-label="Численные состояния, продублированы текстом результата"></svg><ul id="rows"></ul><p id="result" aria-live="polite"></p><script>const svg=document.querySelector('svg'),result=document.getElementById('result');let state={topic:0,turn:0,clarify:0};const get=id=>document.getElementById(id).value;function text(x,y,t){let n=document.createElementNS(svg.namespaceURI,'text');n.setAttribute('x',x);n.setAttribute('y',y);n.setAttribute('font-size','19');n.setAttribute('fill','#183f38');n.textContent=t;svg.append(n)}function row(i,a,b){text(20,98+i*53,a);text(270,98+i*53,b);const li=document.createElement('li');li.textContent=a+': '+b;document.getElementById('rows').append(li)}function bar(x,y,w,color){let n=document.createElementNS(svg.namespaceURI,'rect');Object.entries({x,y,width:w,height:12,fill:color}).forEach(([k,v])=>n.setAttribute(k,v));svg.append(n)}function draw(){svg.replaceChildren();document.getElementById("rows").replaceChildren();row(0,'Тема',Math.min(state.topic+1,2)+' /2');row(1,'Принятые операции',state.turn);row(2,'Уточнения темы',state.clarify);row(3,'Состояние',state.topic>=2?'finished':'ожидается ответ');result.textContent=`Предел ответов при лимите${get('limit')}: ${2*(1+(+get('limit')))}. После finished новые ответы не принимаются. Смена лимита сбрасывает опыт.`;}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{if(el.id==='limit')state={topic:0,turn:0,clarify:0};draw()}));if(document.getElementById('step')){document.getElementById('step').onclick=()=>{if(state.topic<2){state.turn++;if(get('answer')==='short'&&state.clarify<+get('limit'))state.clarify++;else{state.topic++;state.clarify=0}}draw()};document.getElementById('reset').onclick=()=>{state={topic:0,turn:0,clarify:0};draw()}}draw();</script></html>
