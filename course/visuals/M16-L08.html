<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Критическая ошибка не компенсируется средним</title><style>body{font:16px/1.55 Arial;margin:18px;background:#f5f8f4;color:#183f38}h1{font-size:23px}label{display:block;margin:12px 0}input[type=range]{width:220px}select,button{font:inherit;padding:6px;max-width:100%}svg{width:100%;height:auto;min-height:200px;background:white}#result{padding:12px;background:#e4eddf}button:focus,input:focus,select:focus{outline:3px solid #ce9c40}@media(max-width:500px){svg{display:none}#rows{display:block}}#rows{padding-left:22px}#rows li{margin:5px 0}</style><h1>Критическая ошибка не компенсируется средним</h1><p>Отметь проверенные условия. Это учебный расчёт приёмки, а не запись твоего прогресса.</p><label><input type="checkbox" id="run" checked> продукт запускается</label><label><input type="checkbox" id="explain" checked> механизм объяснён</label><label><input type="checkbox" id="new" checked> новый случай решён</label><label><input type="checkbox" id="critical"> есть критическая ошибка</label><svg viewBox="0 0 820 300" role="img" aria-label="Численные состояния, продублированы текстом результата"></svg><ul id="rows"></ul><p id="result" aria-live="polite"></p><script>const svg=document.querySelector('svg'),result=document.getElementById('result');let state={topic:0,turn:0,clarify:0};const get=id=>document.getElementById(id).value;function text(x,y,t){let n=document.createElementNS(svg.namespaceURI,'text');n.setAttribute('x',x);n.setAttribute('y',y);n.setAttribute('font-size','19');n.setAttribute('fill','#183f38');n.textContent=t;svg.append(n)}function row(i,a,b){text(20,98+i*53,a);text(270,98+i*53,b);const li=document.createElement('li');li.textContent=a+': '+b;document.getElementById('rows').append(li)}function bar(x,y,w,color){let n=document.createElementNS(svg.namespaceURI,'rect');Object.entries({x,y,width:w,height:12,fill:color}).forEach(([k,v])=>n.setAttribute(k,v));svg.append(n)}function draw(){svg.replaceChildren();document.getElementById("rows").replaceChildren();let ok=['run','explain','new'].every(id=>document.getElementById(id).checked)&&!document.getElementById('critical').checked;row(0,'Продукт',document.getElementById('run').checked?'да':'нет');row(1,'Понимание',document.getElementById('explain').checked?'да':'нет');row(2,'Новый случай',document.getElementById('new').checked?'да':'нет');row(3,'Решение',ok?'приёмка пройдена в примере':'требуется новая попытка');result.textContent='Никакая сумма остальных баллов не отменяет критическую ошибку или отсутствие самостоятельности.';}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{if(el.id==='limit')state={topic:0,turn:0,clarify:0};draw()}));if(document.getElementById('step')){document.getElementById('step').onclick=()=>{if(state.topic<2){state.turn++;if(get('answer')==='short'&&state.clarify<+get('limit'))state.clarify++;else{state.topic++;state.clarify=0}}draw()};document.getElementById('reset').onclick=()=>{state={topic:0,turn:0,clarify:0};draw()}}draw();</script></html>
