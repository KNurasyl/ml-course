<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>M11 · Согласие оценщиков</title><style>*{box-sizing:border-box}body{margin:0;padding:22px;font:15px/1.6 'Segoe UI',Arial;background:#f5f7ee;color:#243c35}main{max-width:900px;margin:auto}h1{font-size:23px;line-height:1.3;margin:0 0 10px}.tag{font-size:11px;color:#5d7a65;letter-spacing:.1em}label{display:block;font-weight:600;margin-top:15px}input{width:100%;accent-color:#226653}output{font-variant-numeric:tabular-nums;color:#226653}svg{display:block;width:100%;height:auto;min-height:180px;background:white;border:1px solid #d9e2d5;border-radius:10px;margin:15px 0}svg text{font:15px 'Segoe UI',Arial;fill:#29473f}#result{white-space:pre-line;background:#e7efdf;border-radius:8px;padding:13px 17px;font-variant-numeric:tabular-nums}.limit{font-size:12px;color:#647465}.question{font-weight:600}button{border:1px solid #bccdb9;background:white;border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit}button:focus-visible,input:focus-visible{outline:3px solid #c39239;outline-offset:3px}@media(max-width:500px){body{padding:12px}h1{font-size:20px}svg text{font-size:14px}}</style><main><span class="tag">M11 · Численный эксперимент</span><h1>Согласие оценщиков</h1><p class="question">Найди высокое agreement. Достаточно ли этого для доказательства правильности рубрики?</p><label>Порог второго оценщика: <output></output><input type="range" min="0.1" max="0.9" step="0.05" value="0.5" aria-label="Порог второго оценщика"></label><svg viewBox="0 0 740 310" role="img" aria-label="Результат вычисления; числа также приведены ниже"></svg><p id="result" role="status" aria-live="polite"></p><button>Исходное значение</button><p class="limit">Граница модели: Два искусственных оценщика используют один score. Согласие не равно истинности.</p></main><script>const CONFIG=["M11", "Согласие оценщиков", "Порог второго оценщика", 0.1, 0.9, 0.05, 0.5, "Найди высокое agreement. Достаточно ли этого для доказательства правильности рубрики?", "Два искусственных оценщика используют один score. Согласие не равно истинности."];
const c=CONFIG, slider=document.querySelector('input'), out=document.querySelector('output'), svg=document.querySelector('svg'), result=document.querySelector('#result');
const f=(n,d=2)=>Number.isFinite(n)?n.toFixed(d):'не определено';
const node=(tag,attrs,text)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);if(text!==undefined)n.textContent=text;svg.append(n);return n;};
const line=(x1,y1,x2,y2,color='#7d9587',w=2)=>node('line',{x1,y1,x2,y2,stroke:color,'stroke-width':w});
const text=(x,y,t,color)=>node('text',{x,y,fill:color||'#29473f'},t);
const circle=(x,y,r=5,color='#236653')=>node('circle',{cx:x,cy:y,r,fill:color});
const rect=(x,y,w,h,color='#8aaf89')=>node('rect',{x,y,width:w,height:h,fill:color,rx:4});
const bars=(values,labels,max=1)=>{values.forEach((v,i)=>{const x=60+i*(620/values.length);rect(x,255-v/max*180,Math.min(65,450/values.length),v/max*180);text(x,280,labels[i]);text(x,Math.max(35,245-v/max*180),f(v));});};
function draw(){const p=Number(slider.value);out.textContent=p;svg.replaceChildren();let message='';
switch(c[0]){
case'M00':{line(60,195,690,195);line(60,25,60,275);text(25,40,'20');text(30,190,'0');text(25,275,'−10');let prev;for(let x=0;x<=5;x+=.05){let point=[60+x*120,195-(p*x+1)*8];if(prev)line(...prev,...point,'#236653');prev=point;}[0,1,2,3,4,5].forEach(x=>text(60+x*120,215,x));circle(420,195-(p*3+1)*8,7,'#bb8439');text(85,40,'ŷ = w·x + 1');message=`Для x=3: ŷ=${f(p*3+1)}.\nПоменялся параметр w; вход x=3 остался тем же.`;break;}
case'M01':{for(let i=0;i<p;i++)for(let j=0;j<p;j++){rect(170+j*65,40+i*36,60,30,'#d7e8cf');text(190+j*65,62+i*36,i+j);}text(45,25,`(n,1) + (n,) → (${p},${p})`);message=`Столбец [0…${p-1}] плюс строка [0…${p-1}].\nПолучилось ${p*p} элементов. Для поэлементной суммы сначала согласуй формы.`;break;}
case'M02':{const a=p*Math.PI/180;line(300,200,450,200,'#236653',4);line(300,200,300+150*Math.cos(a),200-150*Math.sin(a),'#b98434',4);line(300+150*Math.cos(a),200-150*Math.sin(a),300+150*Math.cos(a),200,'#b98434');text(460,205,'u');text(280+150*Math.cos(a),185-150*Math.sin(a),'v');message=`u·v = cos θ = ${f(Math.cos(a),3)}.\nПри одинаковых единичных длинах меняется только направление.`;break;}
case'M03':{let w=0,history=[w];for(let i=0;i<10;i++){w-=p*2*(w-3);history.push(w);}let scale=Math.max(6,...history.map(Math.abs));line(50,150-3/scale*105,680,150-3/scale*105,'#b98434');history.forEach((v,i)=>{let x=60+i*60,y=150-v/scale*105;circle(x,y);if(i)line(x-60,150-history[i-1]/scale*105,x,y,'#236653');});text(55,285,'Итерации 0 → 10; золотая линия: w*=3');message=`w10=${f(w,4)}, L(w10)=${f((w-3)**2,4)}.\nГрадиент=2(w−3). Сходимость при 0<η<1; η=1 даёт колебания.`;break;}
case'M04':{const se=2/Math.sqrt(p),half=1.96*se;line(60,180,680,180);line(370-half*120,130,370+half*120,130,'#236653',9);circle(370,130,8,'#b98434');text(280,70,'Среднее наблюдений = 5');text(100,225,'Шкала: 1 единица = 120 px');message=`SE = σ/√n = ${f(se,3)}.\n95% интервал: [${f(5-half)}, ${f(5+half)}]. Повторные интервалы покрывают фиксированное μ в 95% выборок при допущениях.`;break;}
case'M05':{const scores=[.1,.2,.35,.45,.55,.65,.8,.9], truth=[0,0,1,0,1,0,1,1];let tp=0,fp=0,fn=0,tn=0;scores.forEach((s,i)=>{let yes=s>=p;if(yes&&truth[i])tp++;else if(yes)fp++;else if(truth[i])fn++;else tn++;rect(45+i*82,80,67,60,yes?'#aacd9d':'#e3e5df');text(55+i*82,105,f(s));text(55+i*82,128,`y=${truth[i]}`);});message=`TP=${tp}, FP=${fp}, FN=${fn}, TN=${tn}\nPrecision=${tp+fp?f(tp/(tp+fp)):'не определено (нет + прогнозов)'}, recall=${f(tp/(tp+fn))}. Решение положительное при score ≥ порога.`;text(65,225,'Зелёный — положительный прогноз. y — настоящий класс.');break;}
case'M06':{const v=[80,120,p,100], labels=['Сеть','Поиск','LLM','Выдача'];let x=40;v.forEach((n,i)=>{let w=n/(p+300)*650;rect(x,110,w,70,['#aecb9d','#79ac9d','#315f57','#bc934e'][i]);text(45+i*170,240,`${labels[i]}: ${n} мс`);x+=w;});message=`Полная задержка = 80+120+${p}+100 = ${p+300} мс.\nПосле ускорения генерации вдвое: ${p/2+300} мс; ускорение всей цепочки ${f((p+300)/(p/2+300))}×.`;break;}
case'M07':{let z=2*p-1,a=Math.max(0,z);line(75,260,715,260);line(100,40,100,275);line(100,260,400,260,'#236653',4);line(400,260,700,85,'#236653',4);circle(100+(p+2)*120,260-a*35,8,'#b98434');[-2,-1,0,1,2,3].forEach(w=>text(100+(w+2)*120,287,w));text(130,60,`z=2w−1=${f(z)}`);text(130,95,`da/dw=${z>0?'2':z<0?'0':'не определена в 0'}`);message=`a=max(0,2w−1)=${f(a)}.\nПри w<0.5 локальный градиент равен нулю; в точке излома фреймворк выбирает соглашение.`;break;}
case'M08':{const exp=[1,2,3].map(x=>Math.exp((x-3)/p)),sum=exp.reduce((a,b)=>a+b),weights=exp.map(x=>x/sum);bars(weights,['Ключ 1','Ключ 2','Ключ 3']);message=`softmax(scores/T)=[${weights.map(x=>f(x,3)).join(', ')}]\nДля values=[10,0,−10] взвешенный выход=${f(10*weights[0]-10*weights[2])}. Сумма весов=${f(weights.reduce((a,b)=>a+b),3)}.`;break;}
case'M09':{let vals=[400,800,p,512],names=['Правила','RAG','История','Ответ'];let x=40;vals.forEach((n,i)=>{let w=n/4712*640;rect(x,100,w,70,['#8cb19a','#b3c78c','#467b6a','#bc934e'][i]);text(40+i*170,265,`${names[i]}: ${n}`);x+=w;});let total=1712+p;line(40+4096/4712*640,50,40+4096/4712*640,220,'#b44536',3);message=`Всего зарезервировано ${total} / 4096 токенов.\n${total<=4096?'Осталось '+(4096-total):'Превышение '+(total-4096)}. Резерв ответа вычитается до отправки prompt.`;break;}
case'M10':{const rel=[1,0,1,1,0,0],hits=rel.slice(0,p).reduce((a,b)=>a+b,0);rel.forEach((r,i)=>{rect(50+i*105,90,85,80,i<p?(r?'#8bb17f':'#d3b18a'):'#e4e8e0');text(60+i*105,135,`${i+1}: ${r?'рел.':'шум'}`);});message=`Precision@${p}=${f(hits/p)}, recall@${p}=${f(hits/3)}.\nВо всей коллекции 3 релевантных документа. Увеличение k не меняет порядок ранжирования.`;break;}
case'M11':{const scores=[.12,.25,.4,.45,.55,.63,.77,.88],a=scores.map(x=>x>=.5),b=scores.map(x=>x>=p);let agree=a.filter((x,i)=>x===b[i]).length;scores.forEach((s,i)=>{rect(40+i*84,75,70,45,a[i]?'#8bb17f':'#e3e6dd');rect(40+i*84,145,70,45,b[i]?'#8bb17f':'#e3e6dd');text(50+i*84,220,f(s));});message=`Согласие ${agree}/8 = ${f(agree/8)}.\nВерхний оценщик: порог 0.5; нижний: ${p}. Нужна независимая разметка качества, а не только agreement.`;break;}
case'M12':{const full=4096,adapter=128*p;bars([full,adapter],['Полная W','A + B'],8192);text(410,70,'W: 64×64');text(410,105,`A: ${p}×64; B: 64×${p}`);message=`Полная матрица: 4096 параметров. Адаптер: ${adapter}.\nДоля обучаемых параметров от полной W: ${f(adapter/full*100,1)}%. Базовые веса по-прежнему хранятся в памяти.`;break;}
case'M13':{let mixed=.01*(1-p/100)+.09*p/100;bars([.01,.09,mixed],['Старая','Новая','Смесь'],.1);message=`Общая доля ошибок: ${f(100*mixed,2)}%.\nПравило: откат при >3%. Решение: ${mixed>.03000001?'откатить':'порог не превышен'}. Среднее может скрыть плохую новую версию.`;break;}
case'M14':{const steps=['Найти','Проверить','Сравнить','Ответить'];steps.forEach((s,i)=>{rect(45+i*170,100,150,70,i<p?'#9fbe8f':'#e4e7dd');text(55+i*170,140,s);if(i<3)text(202+i*170,140,'→');});message=`Выполнено ${Math.min(4,p)} из 4 шагов.\n${p>=4?'Завершён запланированный workflow.':'Бюджет исчерпан: вернуть частичный результат с причиной остановки.'} Повторять тот же неудачный tool call бесконечно нельзя.`;break;}
case'M15':{const scale=.23;rect(50,80,400*scale,50);rect(50+750*scale,80,600*scale,50);line(50+400*scale,160,50+(400+p)*scale,160,'#b98434',5);text(50,55,'Речь 400 мс → пауза 350 мс → речь 600 мс');text(50,225,`После настоящего конца: ${p}+ASR 180+LLM 600+TTS 120 мс`);message=`Условная задержка до ответа: ${p+900} мс.\n${p<350?'Пауза 350 мс длиннее порога: преждевременный конец реплики.':'Пауза не разрывает реплику, но ожидание после настоящего конца увеличивается.'}`;break;}
case'M16':{const values=[.9,p/100,.85];bars(values,['HR','Поиск','Речь']);let avg=values.reduce((a,b)=>a+b)/3;message=`Условное среднее трёх показателей: ${f(avg*100,1)}%.\nКритерий: каждый показатель ≥80%. Итог: ${p>=80?'все пороги достигнуты':'поиск не прошёл приёмку'}, независимо от среднего. Разные метрики нельзя автоматически усреднять в продукте.`;break;}
} result.textContent=message;}
slider.addEventListener('input',draw);document.querySelector('button').onclick=()=>{slider.value=c[6];draw();};draw();
</script></html>
