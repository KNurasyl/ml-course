<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M11 · Согласие оценщиков</title><link rel="stylesheet" href="visual-style.css"></head>
<body><main><span class="tag">M11 · Численный эксперимент</span>
<h1>Согласие оценщиков</h1><p class="question">Найди высокое agreement. Достаточно ли этого для доказательства правильности рубрики?</p>
<div class="control"><label for="parameter"><span>Порог второго оценщика</span><output id="value" for="parameter">0.5</output></label>
<input id="parameter" aria-label="Порог второго оценщика" type="range" min="0.1" max="0.9" step="0.05" value="0.5"></div>
<div class="figure" id="figure"></div><p class="result" id="result" role="status" aria-live="polite"></p>
<button id="reset" type="button">Исходное значение</button><p class="limit"><strong>Граница модели.</strong> Два искусственных оценщика используют один score. Согласие не равно истинности.</p>
</main><script>const CONFIG=["M11", "Согласие оценщиков", "Порог второго оценщика", 0.1, 0.9, 0.05, 0.5, "Найди высокое agreement. Достаточно ли этого для доказательства правильности рубрики?", "Два искусственных оценщика используют один score. Согласие не равно истинности."];</script>
<script src="module-experiments.js"></script><script src="visual-frame.js"></script></body></html>
