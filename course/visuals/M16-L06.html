<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Цитата не равна верному выводу</title><style>body{font:16px/1.55 Arial;margin:18px;background:#f5f8f4;color:#183f38}h1{font-size:23px}label{display:block;margin:12px 0}input[type=range]{width:220px}select,button{font:inherit;padding:6px;max-width:100%}svg{width:100%;height:auto;min-height:200px;background:white}#result{padding:12px;background:#e4eddf}button:focus,input:focus,select:focus{outline:3px solid #ce9c40}@media(max-width:500px){svg{display:none}#rows{display:block}}#rows{padding-left:22px}#rows li{margin:5px 0}</style><h1>Цитата не равна верному выводу</h1><p>Ответ: «Коллега внедрил кеш. Я проверил повторный запрос». Выбирай фрагмент и критерий: что проверит программа, а что человек?</p><label>Фрагмент <select id="fragment"><option value="0">Коллега внедрил кеш.</option><option value="1">Я проверил повторный запрос.</option><option value="2">Мы увеличили выручку.</option></select></label><label>Критерий <select id="criterion"><option>личное действие</option><option>наблюдаемый результат</option></select></label><svg viewBox="0 0 820 300" role="img" aria-label="Численные состояния, продублированы текстом результата"></svg><ul id="rows"></ul><p id="result" aria-live="polite"></p><script>const svg=document.querySelector('svg'),result=document.getElementById('result');let state={topic:0,turn:0,clarify:0};const get=id=>document.getElementById(id).value;function text(x,y,t){let n=document.createElementNS(svg.namespaceURI,'text');n.setAttribute('x',x);n.setAttribute('y',y);n.setAttribute('font-size','19');n.setAttribute('fill','#183f38');n.textContent=t;svg.append(n)}function row(i,a,b){text(20,98+i*53,a);text(270,98+i*53,b);const li=document.createElement('li');li.textContent=a+': '+b;document.getElementById('rows').append(li)}function bar(x,y,w,color){let n=document.createElementNS(svg.namespaceURI,'rect');Object.entries({x,y,width:w,height:12,fill:color}).forEach(([k,v])=>n.setAttribute(k,v));svg.append(n)}function draw(){svg.replaceChildren();document.getElementById("rows").replaceChildren();let k=+get('fragment'),phrase=['Коллега внедрил кеш.','Я проверил повторный запрос.','Мы увеличили выручку.'][k];row(0,'Цитата',phrase);row(1,'Основание',k<2?'подстрока найдена':'подстрока отсутствует → отказ');row(2,'Критерий',get('criterion'));result.textContent=k===0?'Цитата настоящая, но действие коллеги нельзя считать личным действием кандидата. Нужна смысловая проверка.':k===1?'Личное действие указано; измеренный результат всё ещё не описан. Не додумывай эффект.':'Такой фрагмент отсутствует: bounded selector вообще не должен иметь этот вариант. Здесь он показан как контрпример защиты.';}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{if(el.id==='limit')state={topic:0,turn:0,clarify:0};draw()}));if(document.getElementById('step')){document.getElementById('step').onclick=()=>{if(state.topic<2){state.turn++;if(get('answer')==='short'&&state.clarify<+get('limit'))state.clarify++;else{state.topic++;state.clarify=0}}draw()};document.getElementById('reset').onclick=()=>{state={topic:0,turn:0,clarify:0};draw()}}draw();</script></html>
