<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Очередь: предскажи исход третьего запроса</title><style>body{font:16px/1.55 Arial;margin:18px;background:#f5f8f4;color:#183f38}h1{font-size:23px}label{display:block;margin:12px 0}input[type=range]{width:220px}select,button{font:inherit;padding:6px;max-width:100%}svg{width:100%;height:auto;min-height:200px;background:white}#result{padding:12px;background:#e4eddf}button:focus,input:focus,select:focus{outline:3px solid #ce9c40}@media(max-width:500px){svg{display:none}#rows{display:block}}#rows{padding-left:22px}#rows li{margin:5px 0}</style><h1>Очередь: предскажи исход третьего запроса</h1><p>Четыре запроса пришли одновременно; один worker, работа 60 мс. Меняй вместимость и дедлайн. До изменения предскажи число 200/503/504.</p><label>Вместимость <input id="capacity" type="range" min="1" max="4" value="3"></label><label>Ожидание, мс <input id="wait" type="range" min="0" max="200" step="10" value="90"></label><svg viewBox="0 0 820 300" role="img" aria-label="Численные состояния, продублированы текстом результата"></svg><ul id="rows"></ul><p id="result" aria-live="polite"></p><script>const svg=document.querySelector('svg'),result=document.getElementById('result');let state={topic:0,turn:0,clarify:0};const get=id=>document.getElementById(id).value;function text(x,y,t){let n=document.createElementNS(svg.namespaceURI,'text');n.setAttribute('x',x);n.setAttribute('y',y);n.setAttribute('font-size','19');n.setAttribute('fill','#183f38');n.textContent=t;svg.append(n)}function row(i,a,b){text(20,98+i*53,a);text(270,98+i*53,b);const li=document.createElement('li');li.textContent=a+': '+b;document.getElementById('rows').append(li)}function bar(x,y,w,color){let n=document.createElementNS(svg.namespaceURI,'rect');Object.entries({x,y,width:w,height:12,fill:color}).forEach(([k,v])=>n.setAttribute(k,v));svg.append(n)}function draw(){svg.replaceChildren();document.getElementById("rows").replaceChildren();let capacity=+get('capacity'),wait=+get('wait'),next=0;for(let i=0;i<4;i++){let status=i>=capacity?'503':next>wait?'504':'200';let start=next;if(status==='200')next+=60;row(i,'Запрос '+(i+1),status==='200'?`ожидание ${start}; работа ${start}–${start+60} мс`:status==='503'?'503: нет места':'504: превышен дедлайн');if(status==='200')bar(420+start*1.5,108+i*53,90,'#428a6a');}result.textContent=`Вместимость=${capacity}, wait=${wait} мс. Идеальное расписание, не измерение HTTP. Освобождение места после timeout здесь не помогает одновременно уже отвергнутому запросу.`;}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('input',()=>{if(el.id==='limit')state={topic:0,turn:0,clarify:0};draw()}));if(document.getElementById('step')){document.getElementById('step').onclick=()=>{if(state.topic<2){state.turn++;if(get('answer')==='short'&&state.clarify<+get('limit'))state.clarify++;else{state.topic++;state.clarify=0}}draw()};document.getElementById('reset').onclick=()=>{state={topic:0,turn:0,clarify:0};draw()}}draw();</script></html>
