<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вероятность и логарифмическая потеря</title><style>body{font:17px/1.6 Arial;background:#f5f7ee;color:#243c35;padding:20px}main{max-width:780px;margin:auto}label{display:block}input{width:100%}pre{white-space:pre-wrap;background:white;padding:16px}button{padding:9px;font:inherit}table{border-collapse:collapse}td,th{padding:8px;border:1px solid #b8c5b2}</style><main><h1>Вероятность и логарифмическая потеря</h1><p>Предскажи: во сколько раз изменится потеря, если вероятность уменьшится вдвое? Это не линейная зависимость.</p><label>p для класса 1: <input id="p" type="range" min="0.01" max="0.99" step="0.01" value="0.8"></label><label>Истинный класс <select id="y"><option value="1">1</option><option value="0">0</option></select></label><pre id="out" aria-live="polite"></pre><button id="reset">Исходное значение</button><p>Сначала предскажи результат, затем измени параметр и объясни расхождение. Это численный опыт, не измерение качества интервьюера.</p></main><script>const p=document.querySelector('#p'),y=document.querySelector('#y'),out=document.querySelector('#out');function draw(){let prob=+p.value,actual=y.value==='1'?prob:1-prob;out.textContent=`p(класс 1)=${prob.toFixed(2)}
Вероятность фактического класса=${actual.toFixed(2)}
L=−ln(${actual.toFixed(2)})=${(-Math.log(actual)).toFixed(6)}
При уменьшении вероятности фактического класса вдвое потеря добавляет ln(2)≈0.693147.`;}p.oninput=y.onchange=draw;document.querySelector('#reset').onclick=()=>{p.value=.8;y.value='1';draw()};draw();</script></html>
