<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вероятность и логарифмическая потеря</title><link rel="stylesheet" href="theme-tokens.css"><link rel="stylesheet" href="visual-style.css"></head><body><main><span class="tag">M04 · Вероятность → потеря</span><h1>За уверенную ошибку — больше потеря</h1><p class="question">Предскажи: как изменится потеря, если вероятность фактического класса уменьшится вдвое?</p><div class="control"><label for="p"><span>p для класса 1</span><output id="p-value" for="p">0.80</output></label><input id="p" type="range" min="0.01" max="0.99" step="0.01" value="0.8"></div><label for="y">Истинный класс <select id="y"><option value="1">1</option><option value="0">0</option></select></label><div id="figure" class="figure"></div><p id="out" class="result" role="status" aria-live="polite"></p><button id="reset" type="button">Исходное значение</button><p class="limit"><strong>Граница модели.</strong> Один бинарный пример. Это численный опыт, а не измерение качества интервьюера.</p></main><script>
const p=document.querySelector('#p'),y=document.querySelector('#y'),out=document.querySelector('#out'),figure=document.querySelector('#figure');
function draw(){let prob=+p.value,actual=y.value==='1'?prob:1-prob,loss=-Math.log(actual);document.querySelector('#p-value').textContent=prob.toFixed(2);
figure.innerHTML=`<div class="bar-list"><div><div class="bar-head"><span>Вероятность фактического класса</span><span>${actual.toFixed(2)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${actual*100}%;background:var(--accent)"></div></div></div><div><div class="bar-head"><span>Потеря −ln(p), шкала 0…5</span><span>${loss.toFixed(3)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${loss/5*100}%;background:var(--hint)"></div></div></div></div><p class="chart-caption">У полос разные единицы и шкалы. Сравнивай изменение каждой полосы при движении ползунка.</p>`;
out.textContent=`L = −ln(${actual.toFixed(2)}) = ${loss.toFixed(6)}.\nЕсли вероятность фактического класса уменьшить вдвое, потеря увеличится на ln(2) ≈ 0.693147. Это добавка, а не умножение потери на два.`;}
p.oninput=y.onchange=draw;document.querySelector('#reset').onclick=()=>{p.value=.8;y.value='1';draw()};draw();
</script><script src="visual-frame.js"></script></body></html>
